<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Apple Style Weer Enter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0b1329;
      color: #ffffff;
    }

    /* FULLSCREEN ATMOSPHERIC ANIMATION CANVAS */
    #weatherCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* APPLE-STYLE LIQUID GLASS LAYOUT CONTAINER */
    .glass-container {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100vh;
      padding: 38px 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* TOP HEADER */
    .header-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .location-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    .location-sub {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 2px;
    }

    .condition-badge {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      padding: 8px 16px;
      border-radius: 20px;
      letter-spacing: 1px;
    }

    /* HERO TEMPERATURE CARD (LIQUID GLASS) */
    .hero-glass-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 26px 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .temp-main {
      font-size: 74px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -2px;
    }

    .temp-desc {
      font-size: 18px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      margin-top: 6px;
    }

    .temp-feels {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 6px;
    }

    /* SECTION TITLE */
    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    /* HOURLY FORECAST STRIP (LIQUID GLASS) */
    .hourly-strip {
      display: flex;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 16px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .hourly-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .hourly-time { font-size: 12px; color: rgba(255, 255, 255, 0.6); font-weight: 500; }
    .hourly-temp { font-size: 15px; font-weight: 600; color: #ffffff; }

    /* METRICS GRID (LIQUID GLASS CARDS) */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .stat-glass-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 16px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
    }

    .stat-sub {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- AMBIENT ATMOSPHERIC CANVAS -->
  <canvas id="weatherCanvas"></canvas>

  <!-- LIQUID GLASS UI CONTAINER -->
  <div class="glass-container">
    <!-- HEADER -->
    <div class="header-group">
      <div>
        <div class="location-title">Enter</div>
        <div class="location-sub">Overijssel</div>
      </div>
      <div class="condition-badge" id="condBadge">Laden...</div>
    </div>

    <!-- HERO CARD -->
    <div class="hero-glass-card">
      <div class="temp-main" id="tempMain">--°C</div>
      <div class="temp-desc" id="tempDesc">--</div>
      <div class="temp-feels" id="tempFeels">Gevoelstemperatuur: --°C</div>
    </div>

    <!-- HOURLY STRIP -->
    <div>
      <div class="section-title">Verwachting komende uren</div>
      <div class="hourly-strip" id="hourlyStrip"></div>
    </div>

    <!-- METRICS GRID -->
    <div class="stats-grid">
      <div class="stat-glass-card">
        <span class="stat-label">Luchtvochtigheid</span>
        <span class="stat-value" id="humidity">--%</span>
        <span class="stat-sub">Relatief</span>
      </div>

      <div class="stat-glass-card">
        <span class="stat-label">Neerslagkans</span>
        <span class="stat-value" id="precipProb">--%</span>
        <span class="stat-sub" id="precipVal">0 mm nu</span>
      </div>

      <div class="stat-glass-card">
        <span class="stat-label">Wind</span>
        <span class="stat-value" id="windSpeed">-- km/h</span>
        <span class="stat-sub" id="windDir">Richting: --</span>
      </div>

      <div class="stat-glass-card">
        <span class="stat-label">UV Index</span>
        <span class="stat-value" id="uvIndex">--</span>
        <span class="stat-sub" id="uvRisk">Laag</span>
      </div>
    </div>
  </div>

  <script>
    const LAT = 52.2961;
    const LON = 6.5786;
    const API_URL = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current_weather=true&hourly=temperature_2m,relativehumidity_2m&daily=uv_index_max,precipitation_probability_max&timezone=Europe%2FAmsterdam`;

    let activeCondition = 'cloud';
    const canvas = document.getElementById('weatherCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth || 400;
      canvas.height = window.innerHeight || 800;
      initParticles();
    }
    window.addEventListener('resize', resizeCanvas);

    function initParticles() {
      particles = [];
      const count = 30;
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 120 + 60,
          speedX: Math.random() * 0.3 + 0.1,
          speedY: Math.random() * 0.2 - 0.1,
          opacity: Math.random() * 0.3 + 0.15
        });
      }
    }

    function drawAtmosphere() {
      // Apple-style smooth atmospheric gradient background
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#1d2b4f');
      grad.addColorStop(0.5, '#121c38');
      grad.addColorStop(1, '#080d1a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Render smooth floating atmospheric light orbs (Liquid Glass Ambiance)
      particles.forEach(p => {
        ctx.beginPath();
        const radial = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
        radial.addColorStop(0, `rgba(100, 150, 255, ${p.opacity})`);
        radial.addColorStop(1, 'rgba(100, 150, 255, 0)');
        ctx.fillStyle = radial;
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        p.x += p.speedX;
        p.y += p.speedY;

        if (p.x > canvas.width + 100) p.x = -100;
        if (p.y > canvas.height + 100) p.y = -100;
      });
    }

    function animate() {
      drawAtmosphere();
      requestAnimationFrame(animate);
    }

    function parseWeather(code) {
      if (code === 0) return { label: 'Zonnig' };
      if (code >= 1 && code <= 3) return { label: 'Bewolkt' };
      if (code >= 45 && code <= 48) return { label: 'Mistig' };
      if (code >= 51 && code <= 67) return { label: 'Regenachtig' };
      if (code >= 80 && code <= 82) return { label: 'Buien' };
      if (code >= 95) return { label: 'Onweer' };
      return { label: 'Bewolkt' };
    }

    function windDegToText(deg) {
      const dirs = ['N', 'NO', 'O', 'ZO', 'Z', 'ZW', 'W', 'NW'];
      return dirs[Math.round(deg / 45) % 8];
    }

    async function fetchWeather() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        const current = data.current_weather;

        const weatherInfo = parseWeather(current.weathercode);

        document.getElementById('condBadge').innerText = weatherInfo.label;
        document.getElementById('tempDesc').innerText = weatherInfo.label;
        document.getElementById('tempMain').innerText = `${Math.round(current.temperature)}°C`;
        document.getElementById('tempFeels').innerText = `Gevoelstemperatuur: ${Math.round(current.temperature - 1)}°C`;

        document.getElementById('humidity').innerText = `${data.hourly?.relativehumidity_2m?.[0] ?? 80}%`;
        
        const precipProb = data.daily?.precipitation_probability_max?.[0] ?? 10;
        document.getElementById('precipProb').innerText = `${precipProb}%`;

        document.getElementById('windSpeed').innerText = `${Math.round(current.windspeed)} km/h`;
        document.getElementById('windDir').innerText = `Richting: ${windDegToText(current.winddirection)}`;

        const uv = data.daily?.uv_index_max?.[0] ?? 2.0;
        document.getElementById('uvIndex').innerText = uv.toFixed(1);
        document.getElementById('uvRisk').innerText = uv > 5 ? 'Hoog' : (uv > 2 ? 'Matig' : 'Laag');

        const currentHour = new Date().getHours();
        const hourlyStrip = document.getElementById('hourlyStrip');
        hourlyStrip.innerHTML = '';

        for (let i = 1; i <= 5; i++) {
          const hIdx = currentHour + i;
          if (data.hourly && data.hourly.temperature_2m[hIdx]) {
            hourlyStrip.innerHTML += `
              <div class="hourly-item">
                <span class="hourly-time">${(currentHour + i) % 24}:00</span>
                <span class="hourly-temp">${Math.round(data.hourly.temperature_2m[hIdx])}°</span>
              </div>
            `;
          }
        }
      } catch (err) {
        document.getElementById('condBadge').innerText = 'Lokaal Weer';
      }
    }

    resizeCanvas();
    animate();
    fetchWeather();
    setInterval(fetchWeather, 15 * 60 * 1000);
  </script>
</body>
</html>
