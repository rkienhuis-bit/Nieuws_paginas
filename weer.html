<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>NOS Weer Enter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0b0e14;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 32px;
      position: relative;
    }

    /* ATMOSPHERIC BACKGROUND GLOW EFFECT */
    .ambiance-glow {
      position: absolute;
      top: 0; right: 0;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(227,6,19,0.12) 0%, rgba(0,0,0,0) 70%);
      z-index: 0;
      pointer-events: none;
    }

    .content-layer {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      width: 100%;
    }

    /* TOP HEADER */
    .header-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .location-title {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .location-sub {
      font-size: 13px;
      color: #888888;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 2px;
    }

    .condition-badge {
      background: #e30613; /* NOS Red */
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 8px 16px;
      border-radius: 6px;
      letter-spacing: 1.5px;
      box-shadow: 0 6px 20px rgba(227, 6, 19, 0.4);
    }

    /* HERO WEATHER CARD (CLEAN, NO UGLY BOXES) */
    .hero-section {
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 18px;
      padding: 28px 32px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .temp-row {
      display: flex;
      align-items: baseline;
      gap: 15px;
    }

    .temp-main {
      font-size: 80px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
    }

    .temp-desc {
      font-size: 20px;
      font-weight: 600;
      color: #dddddd;
      text-transform: capitalize;
    }

    .temp-feels {
      font-size: 15px;
      color: #999999;
      margin-top: 10px;
      font-weight: 500;
    }

    /* SECTION TITLE */
    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: #888888;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
    }

    /* HOURLY FORECAST STRIP */
    .hourly-strip {
      display: flex;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      padding: 16px 18px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(10px);
    }

    .hourly-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .hourly-time { font-size: 13px; color: #888888; font-weight: 600; }
    .hourly-temp { font-size: 16px; font-weight: 700; color: #ffffff; }

    /* METRICS GRID */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.03);
      padding: 16px 20px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 11px;
      color: #888888;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
    }

    .stat-sub {
      font-size: 12px;
      color: #aaaaaa;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- ATMOSPHERIC GLOW -->
  <div class="ambiance-glow"></div>

  <div class="content-layer">
    <!-- HEADER -->
    <div class="header-group">
      <div>
        <div class="location-title">Enter</div>
        <div class="location-sub">Overijssel</div>
      </div>
      <div class="condition-badge" id="condBadge">Laden...</div>
    </div>

    <!-- HERO SECTION -->
    <div class="hero-section">
      <div class="temp-row">
        <div class="temp-main" id="tempMain">--°C</div>
        <div class="temp-desc" id="tempDesc">--</div>
      </div>
      <div class="temp-feels" id="tempFeels">Gevoelssperatuur: --°C</div>
    </div>

    <!-- HOURLY FORECAST -->
    <div>
      <div class="section-title">Verwachting komende uren</div>
      <div class="hourly-strip" id="hourlyStrip"></div>
    </div>

    <!-- METRICS GRID -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Luchtvochtigheid</span>
        <span class="stat-value" id="humidity">--%</span>
        <span class="stat-sub">Relatief</span>
      </div>

      <div class="stat-card">
        <span class="stat-label">Neerslagkans</span>
        <span class="stat-value" id="precipProb">--%</span>
        <span class="stat-sub" id="precipVal">0 mm nu</span>
      </div>

      <div class="stat-card">
        <span class="stat-label">Wind</span>
        <span class="stat-value" id="windSpeed">-- km/h</span>
        <span class="stat-sub" id="windDir">Richting: --</span>
      </div>

      <div class="stat-card">
        <span class="stat-label">UV Index</span>
        <span class="stat-value" id="uvIndex">--</span>
        <span class="stat-sub" id="uvRisk">Laag</span>
      </div>
    </div>
  </div>

  <script>
    const LAT = 52.2961;
    const LON = 6.5786;
    const API_URL = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current_weather=true&hourly=temperature_2m,relativehumidity_2m&daily=uv_index_max,precipitation_probability_max&timezone=Europe%2FAmsterdam`;

    function parseWeather(code) {
      if (code === 0) return { label: 'Zonnig' };
      if (code >= 1 && code <= 3) return { label: 'Bewolkt' };
      if (code >= 45 && code <= 48) return { label: 'Mistig' };
      if (code >= 51 && code <= 67) return { label: 'Regenachtig' };
      if (code >= 80 && code <= 82) return { label: 'Buien' };
      if (code >= 95) return { label: 'Onweer' };
      return { label: 'Bewolkt' };
    }

    function windDegToText(deg) {
      const dirs = ['N', 'NO', 'O', 'ZO', 'Z', 'ZW', 'W', 'NW'];
      return dirs[Math.round(deg / 45) % 8];
    }

    async function fetchWeather() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        const current = data.current_weather;

        const weatherInfo = parseWeather(current.weathercode);

        document.getElementById('condBadge').innerText = weatherInfo.label;
        document.getElementById('tempDesc').innerText = weatherInfo.label.toLowerCase();
        document.getElementById('tempMain').innerText = `${Math.round(current.temperature)}°C`;
        document.getElementById('tempFeels').innerText = `Gevoelstemperatuur: ${Math.round(current.temperature - 1)}°C`;

        document.getElementById('humidity').innerText = `${data.hourly?.relativehumidity_2m?.[0] ?? 80}%`;
        
        const precipProb = data.daily?.precipitation_probability_max?.[0] ?? 10;
        document.getElementById('precipProb').innerText = `${precipProb}%`;

        document.getElementById('windSpeed').innerText = `${Math.round(current.windspeed)} km/h`;
        document.getElementById('windDir').innerText = `Richting: ${windDegToText(current.winddirection)}`;

        const uv = data.daily?.uv_index_max?.[0] ?? 2.0;
        document.getElementById('uvIndex').innerText = uv.toFixed(1);
        document.getElementById('uvRisk').innerText = uv > 5 ? 'Hoog' : (uv > 2 ? 'Matig' : 'Laag');

        const currentHour = new Date().getHours();
        const hourlyStrip = document.getElementById('hourlyStrip');
        hourlyStrip.innerHTML = '';

        for (let i = 1; i <= 5; i++) {
          const hIdx = currentHour + i;
          if (data.hourly && data.hourly.temperature_2m[hIdx]) {
            hourlyStrip.innerHTML += `
              <div class="hourly-item">
                <span class="hourly-time">${(currentHour + i) % 24}:00</span>
                <span class="hourly-temp">${Math.round(data.hourly.temperature_2m[hIdx])}°</span>
              </div>
            `;
          }
        }
      } catch (err) {
        document.getElementById('condBadge').innerText = 'Lokaal Weer';
      }
    }

    fetchWeather();
    setInterval(fetchWeather, 15 * 60 * 1000);
  </script>
</body>
</html>
