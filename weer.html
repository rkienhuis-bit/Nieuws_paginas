<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>NOS Weer Enter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #090d16;
      color: #ffffff;
    }

    /* FULLSCREEN CANVAS ANIMATION LAYER */
    #weatherCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* UI OVERLAY CONTAINER */
    .weather-overlay {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100vh;
      background: linear-gradient(180deg, rgba(10, 15, 26, 0.75) 0%, rgba(5, 8, 15, 0.92) 100%);
      padding: 45px 35px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(1px);
    }

    /* TOP HEADER */
    .header-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .location-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .location-sub {
      font-size: 13px;
      color: #888888;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 2px;
    }

    .condition-badge {
      background: #e30613; /* NOS Red */
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 6px;
      letter-spacing: 1.5px;
      box-shadow: 0 4px 15px rgba(227, 6, 19, 0.4);
    }

    /* HERO WEATHER CARD */
    .hero-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 22px 30px;
    }

    .temp-main {
      font-size: 72px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
    }

    .temp-feels {
      font-size: 15px;
      color: #bbbbbb;
      margin-top: 6px;
      font-weight: 500;
    }

    /* SECTION TITLE */
    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: #888888;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
    }

    /* HOURLY FORECAST STRIP */
    .hourly-strip {
      display: flex;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      padding: 14px 15px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .hourly-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .hourly-time { font-size: 13px; color: #888888; font-weight: 600; }
    .hourly-temp { font-size: 16px; font-weight: 700; color: #ffffff; }

    /* METRICS GRID */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      padding: 16px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 11px;
      color: #888888;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
    }

    .stat-sub {
      font-size: 12px;
      color: #aaaaaa;
      margin-top: 3px;
    }
  </style>
</head>
<body>

  <!-- BACKGROUND REALISTIC WEATHER ANIMATION CANVAS -->
  <canvas id="weatherCanvas"></canvas>

  <!-- WEATHER UI OVERLAY -->
  <div class="weather-overlay">
    <!-- HEADER -->
    <div class="header-group">
      <div>
        <div class="location-title">Enter</div>
        <div class="location-sub">Overijssel</div>
      </div>
      <div class="condition-badge" id="condBadge">Laden...</div>
    </div>

    <!-- HERO SECTION -->
    <div class="hero-section">
      <div>
        <div class="temp-main" id="tempMain">--°C</div>
        <div class="temp-feels" id="tempFeels">Gevoel: --°C</div>
      </div>
    </div>

    <!-- HOURLY FORECAST -->
    <div>
      <div class="section-title">Verwachting komende uren</div>
      <div class="hourly-strip" id="hourlyStrip"></div>
    </div>

    <!-- METRICS GRID -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Luchtvochtigheid</span>
        <span class="stat-value" id="humidity">--%</span>
        <span class="stat-sub">Relatief</span>
      </div>

      <div class="stat-card">
        <span class="stat-label">Neerslagkans</span>
        <span class="stat-value" id="precipProb">--%</span>
        <span class="stat-sub" id="precipVal">0 mm nu</span>
      </div>

      <div class="stat-card">
        <span class="stat-label">Wind</span>
        <span class="stat-value" id="windSpeed">-- km/h</span>
        <span class="stat-sub" id="windDir">Richting: --</span>
      </div>

      <div class="stat-card">
        <span class="stat-label">UV Index</span>
        <span class="stat-value" id="uvIndex">--</span>
        <span class="stat-sub" id="uvRisk">Laag</span>
      </div>
    </div>
  </div>

  <script>
    const LAT = 52.2961;
    const LON = 6.5786;
    const API_URL = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current_weather=true&hourly=temperature_2m,relativehumidity_2m&daily=uv_index_max,precipitation_probability_max&timezone=Europe%2FAmsterdam`;

    let activeCondition = 'cloud'; // 'sun', 'rain', 'cloud', 'mist'
    const canvas = document.getElementById('weatherCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth || 400;
      canvas.height = window.innerHeight || 800;
      initParticles();
    }
    window.addEventListener('resize', resizeCanvas);

    function initParticles() {
      particles = [];
      const count = activeCondition === 'rain' ? 140 : (activeCondition === 'sun' ? 35 : 45);

      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: activeCondition === 'rain' ? Math.random() * 2 + 1 : Math.random() * 90 + 40,
          speedY: activeCondition === 'rain' ? Math.random() * 9 + 11 : Math.random() * 0.25 - 0.12,
          speedX: activeCondition === 'rain' ? Math.random() * 1.2 - 0.6 : Math.random() * 0.6 + 0.2,
          opacity: Math.random() * 0.5 + 0.2
        });
      }
    }

    function drawAtmosphere() {
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      if (activeCondition === 'sun') {
        grad.addColorStop(0, '#1c150b');
        grad.addColorStop(1, '#070503');
      } else if (activeCondition === 'rain') {
        grad.addColorStop(0, '#0a111d');
        grad.addColorStop(1, '#04070c');
      } else if (activeCondition === 'mist') {
        grad.addColorStop(0, '#161c24');
        grad.addColorStop(1, '#090c11');
      } else {
        // Default cloudy/overcast mood
        grad.addColorStop(0, '#121824');
        grad.addColorStop(1, '#070a10');
      }
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function animate() {
      drawAtmosphere();

      if (activeCondition === 'rain') {
        // Realistic falling rain streaks
        ctx.strokeStyle = 'rgba(170, 215, 255, 0.65)';
        ctx.lineWidth = 1.6;
        particles.forEach(p => {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x + p.speedX * 2, p.y + p.size * 6);
          ctx.stroke();

          p.y += p.speedY;
          p.x += p.speedX;

          if (p.y > canvas.height) {
            p.y = -20;
            p.x = Math.random() * canvas.width;
          }
        });
      } else if (activeCondition === 'sun') {
        // Soft glowing sunbeam floating particles
        particles.forEach(p => {
          ctx.beginPath();
          const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
          gradient.addColorStop(0, `rgba(255, 175, 0, ${p.opacity * 0.8})`);
          gradient.addColorStop(1, 'rgba(255, 175, 0, 0)');
          ctx.fillStyle = gradient;
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();

          p.x += p.speedX;
          p.y += p.speedY;

          if (p.x > canvas.width + 50) p.x = -50;
          if (p.y > canvas.height + 50) p.y = -50;
        });
      } else {
        // Rich rolling clouds / mist atmosphere
        particles.forEach(p => {
          ctx.beginPath();
          const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 2.5);
          gradient.addColorStop(0, `rgba(255, 255, 255, ${p.opacity * 0.22})`);
          gradient.addColorStop(0.5, `rgba(160, 185, 210, ${p.opacity * 0.1})`);
          gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = gradient;
          ctx.arc(p.x, p.y, p.size * 2.5, 0, Math.PI * 2);
          ctx.fill();

          p.x += p.speedX;
          if (p.x > canvas.width + 200) p.x = -200;
        });
      }

      requestAnimationFrame(animate);
    }

    function parseWeatherCode(code) {
      if (code === 0) return { label: 'Zonnig', type: 'sun' };
      if (code >= 1 && code <= 3) return { label: 'Bewolkt', type: 'cloud' };
      if (code >= 45 && code <= 48) return { label: 'Mistig', type: 'mist' };
      if (code >= 51 && code <= 67) return { label: 'Regen', type: 'rain' };
      if (code >= 80 && code <= 82) return { label: 'Buien', type: 'rain' };
      if (code >= 95) return { label: 'Onweer', type: 'rain' };
      return { label: 'Bewolkt', type: 'cloud' };
    }

    function windDegToText(deg) {
      const dirs = ['N', 'NO', 'O', 'ZO', 'Z', 'ZW', 'W', 'NW'];
      return dirs[Math.round(deg / 45) % 8];
    }

    async function fetchWeather() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        const current = data.current_weather;

        const cond = parseWeatherCode(current.weathercode);
        activeCondition = cond.type;
        initParticles();

        document.getElementById('condBadge').innerText = cond.label;
        document.getElementById('tempMain').innerText = `${Math.round(current.temperature)}°C`;
        document.getElementById('tempFeels').innerText = `Gevoel: ${Math.round(current.temperature - 1)}°C`;

        document.getElementById('humidity').innerText = `${data.hourly?.relativehumidity_2m?.[0] ?? 80}%`;
        
        const precipProb = data.daily?.precipitation_probability_max?.[0] ?? 10;
        document.getElementById('precipProb').innerText = `${precipProb}%`;

        document.getElementById('windSpeed').innerText = `${Math.round(current.windspeed)} km/h`;
        document.getElementById('windDir').innerText = `Richting: ${windDegToText(current.winddirection)}`;

        const uv = data.daily?.uv_index_max?.[0] ?? 2.0;
        document.getElementById('uvIndex').innerText = uv.toFixed(1);
        document.getElementById('uvRisk').innerText = uv > 5 ? 'Hoog' : (uv > 2 ? 'Matig' : 'Laag');

        const currentHour = new Date().getHours();
        const hourlyStrip = document.getElementById('hourlyStrip');
        hourlyStrip.innerHTML = '';

        for (let i = 1; i <= 5; i++) {
          const hIdx = currentHour + i;
          if (data.hourly && data.hourly.temperature_2m[hIdx]) {
            hourlyStrip.innerHTML += `
              <div class="hourly-item">
                <span class="hourly-time">${(currentHour + i) % 24}:00</span>
                <span class="hourly-temp">${Math.round(data.hourly.temperature_2m[hIdx])}°</span>
              </div>
            `;
          }
        }
      } catch (err) {
        document.getElementById('condBadge').innerText = 'Lokaal Weer';
      }
    }

    resizeCanvas();
    animate();
    fetchWeather();
    setInterval(fetchWeather, 15 * 60 * 1000);
  </script>
</body>
</html>
