<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>NOS Weer Enter - Digital Signage</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080c14;
    }

    /* BACKGROUND ATMOSPHERIC ANIMATION CANVAS */
    #weatherCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* PERFECTLY CENTERED SIGNAGE WRAPPER */
    .dashboard-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 940px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
    }

    /* FROSTED GLASS MIXIN */
    .glass-card {
      background: rgba(16, 22, 36, 0.65);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
    }

    /* ENLARGED TOP HERO CARD */
    .hero-card {
      padding: 20px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hero-left h1 {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .condition-title {
      font-size: 16px;
      font-weight: 600;
      color: #ff3b30;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .temp-large {
      font-size: 48px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -1.5px;
    }

    .feels-like {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 5px;
    }

    .hero-right {
      text-align: right;
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      padding-left: 16px;
    }

    .date-text {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 500;
      margin-bottom: 2px;
    }

    .time-text {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .hero-sub-info {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.85);
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-end;
    }

    .sub-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .sub-row svg {
      width: 15px;
      height: 15px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* HOURLY FORECAST STRIP */
    .hourly-container {
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
    }

    .hourly-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .hourly-time { font-size: 10px; color: rgba(255, 255, 255, 0.6); font-weight: 600; }
    .hourly-icon svg { width: 18px; height: 18px; stroke: #ffffff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .hourly-temp { font-size: 13px; font-weight: 700; }

    /* STATS GRID (2x3 Layout) */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-card {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 85px;
    }

    .stat-header {
      font-size: 10px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-header svg {
      width: 12px;
      height: 12px;
      stroke: rgba(255, 255, 255, 0.8);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .stat-main-val {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.1;
    }

    .stat-footer-text {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
    }

    /* COMPASS */
    .compass-box {
      position: relative;
      width: 30px;
      height: 30px;
      border: 2px dashed rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      align-self: flex-end;
      margin-top: -24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .compass-needle {
      width: 2px;
      height: 13px;
      background: #ff3b30;
      border-radius: 2px;
      transform-origin: bottom center;
      position: absolute;
      bottom: 13px;
    }

    /* SUN ARC */
    .sun-arc-container {
      position: relative;
      height: 14px;
      margin-top: 2px;
    }
    .sun-curve {
      width: 100%;
      height: 8px;
      border-bottom: 2px solid rgba(255,255,255,0.25);
      border-radius: 0 0 50% 50%;
    }

    /* AQI BAR */
    .aqi-bar {
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #4cd137, #fbc531, #e84118);
      border-radius: 2px;
      position: relative;
      margin-top: 4px;
    }
    .aqi-pointer {
      width: 8px;
      height: 8px;
      background: #ffffff;
      border: 2px solid #141928;
      border-radius: 50%;
      position: absolute;
      top: -2px;
      left: 35%;
    }
  </style>
</head>
<body>

  <!-- BACKGROUND ATMOSPHERIC ANIMATION CANVAS -->
  <canvas id="weatherCanvas"></canvas>

  <div class="dashboard-container">
    <!-- TOP HERO CARD (ENLARGED) -->
    <div class="glass-card hero-card">
      <div class="hero-left">
        <h1>📍 Enter</h1>
        <div class="condition-title" id="condMain">Laden...</div>
        <div class="temp-large" id="tempMain">--°C</div>
        <div class="feels-like" id="feelsMain">GEVOELSTEMPERATUUR: --°C</div>
      </div>
      <div class="hero-right">
        <div class="date-text" id="dateText">--</div>
        <div class="time-text" id="timeText">--:--</div>
        <div class="hero-sub-info">
          <div class="sub-row">
            <span id="subCondText">--</span>
            <span id="subCondIcon"></span>
          </div>
          <div class="sub-row">
            <span id="subRainText">Regen - 0%</span>
            <svg viewBox="0 0 24 24"><path d="M12 2v6m0 8v4M4.93 10.93l4.24 4.24m5.66 0l4.24-4.24"/></svg>
          </div>
        </div>
      </div>
    </div>

    <!-- HOURLY STRIP -->
    <div class="glass-card hourly-container" id="hourlyStrip">
      <!-- Populated via JS -->
    </div>

    <!-- STATS GRID 2x3 -->
    <div class="stats-grid">
      <!-- LUCHTVOCHTIGHEID -->
      <div class="glass-card stat-card">
        <div class="stat-header">
          <svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
          Luchtvochtigheid
        </div>
        <div>
          <div class="stat-main-val" id="humidityVal">--%</div>
          <div class="stat-footer-text">Relatieve luchtvochtigheid</div>
        </div>
      </div>

      <!-- NEERSLAG -->
      <div class="glass-card stat-card">
        <div class="stat-header">
          <svg viewBox="0 0 24 24"><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/></svg>
          Neerslagkans
        </div>
        <div>
          <div class="stat-main-val" id="precipVal">--%</div>
          <div class="stat-footer-text">Verwachting vandaag</div>
        </div>
      </div>

      <!-- WIND -->
      <div class="glass-card stat-card">
        <div class="stat-header">
          <svg viewBox="0 0 24 24"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19 12H2"/></svg>
          Wind
        </div>
        <div>
          <div class="stat-main-val" id="windVal" style="font-size: 16px;">-- km/h</div>
          <div class="stat-footer-text" id="windText">Richting: --</div>
        </div>
        <div class="compass-box">
          <div class="compass-needle" id="compassNeedle"></div>
        </div>
      </div>

      <!-- DAGLICHT -->
      <div class="glass-card stat-card">
        <div class="stat-header">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41m12.02-12.02l-1.41 1.41"/></svg>
          Daglicht
        </div>
        <div>
          <div class="sun-arc-container">
            <div class="sun-curve"></div>
          </div>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 9px; color: rgba(255,255,255,0.7);">
          <span>Opkomst: <b id="sunriseTime">--:--</b></span>
          <span>Ondergang: <b id="sunsetTime">--:--</b></span>
        </div>
      </div>

      <!-- ZICHT -->
      <div class="glass-card stat-card">
        <div class="stat-header">
          <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          Zicht
        </div>
        <div>
          <div class="stat-main-val">10 km</div>
          <div class="stat-footer-text">Uitstekend zicht</div>
        </div>
      </div>

      <!-- LUCHTKWALITEIT -->
      <div class="glass-card stat-card">
        <div class="stat-header">
          <svg viewBox="0 0 24 24"><path d="M2 12h10m4 0h4M4 16h6m4 0h6M6 8h4m4 0h6"/></svg>
          Luchtkwaliteit
        </div>
        <div>
          <div class="stat-main-val" style="font-size: 18px;">3 <span style="font-size: 11px; font-weight: 500; color:#fbc531;">Matig</span></div>
          <div class="aqi-bar">
            <div class="aqi-pointer"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const LAT = 52.2961;
    const LON = 6.5786;
    const API_URL = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,weather_code&daily=sunrise,sunset,precipitation_probability_max&timezone=Europe%2FAmsterdam`;

    const icons = {
      sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41m12.02-12.02l-1.41 1.41"/></svg>',
      cloud: '<svg viewBox="0 0 24 24"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>',
      rain: '<svg viewBox="0 0 24 24"><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/><path d="M8 19v2m4-2v2m4-2v2"/></svg>',
      thunder: '<svg viewBox="0 0 24 24"><path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9M13 11l-4 6h6l-4 6"/></svg>',
      mist: '<svg viewBox="0 0 24 24"><path d="M3 10h18M3 14h18M5 18h14M7 6h10"/></svg>'
    };

    const canvas = document.getElementById('weatherCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let activeAtmosphere = 'cloud';

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initParticles();
    }
    window.addEventListener('resize', resizeCanvas);

    function initParticles() {
      particles = [];
      const count = activeAtmosphere === 'rain' ? 100 : 30;
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: activeAtmosphere === 'rain' ? Math.random() * 2 + 1 : Math.random() * 100 + 50,
          speedY: activeAtmosphere === 'rain' ? Math.random() * 8 + 10 : Math.random() * 0.2 - 0.1,
          speedX: activeAtmosphere === 'rain' ? Math.random() * 1 - 0.5 : Math.random() * 0.3 + 0.1,
          opacity: Math.random() * 0.3 + 0.1
        });
      }
    }

    function drawAtmosphere() {
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      if (activeAtmosphere === 'sun') {
        grad.addColorStop(0, '#26190c');
        grad.addColorStop(1, '#0d0904');
      } else if (activeAtmosphere === 'rain') {
        grad.addColorStop(0, '#0c1626');
        grad.addColorStop(1, '#060a12');
      } else {
        grad.addColorStop(0, '#162238');
        grad.addColorStop(0.5, '#0e1524');
        grad.addColorStop(1, '#080c14');
      }
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (activeAtmosphere === 'rain') {
        ctx.strokeStyle = 'rgba(180, 220, 255, 0.5)';
        ctx.lineWidth = 1.5;
        particles.forEach(p => {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x + p.speedX * 2, p.y + p.size * 5);
          ctx.stroke();
          p.y += p.speedY;
          if (p.y > canvas.height) { p.y = -20; p.x = Math.random() * canvas.width; }
        });
      } else {
        particles.forEach(p => {
          ctx.beginPath();
          const radial = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
          radial.addColorStop(0, `rgba(120, 160, 220, ${p.opacity})`);
          radial.addColorStop(1, 'rgba(120, 160, 220, 0)');
          ctx.fillStyle = radial;
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();

          p.x += p.speedX;
          if (p.x > canvas.width + 100) p.x = -100;
        });
      }
      requestAnimationFrame(drawAtmosphere);
    }

    function updateClockAndDate() {
      const now = new Date();
      const optionsDate = { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' };
      document.getElementById('dateText').innerText = now.toLocaleDateString('nl-NL', optionsDate);
      document.getElementById('timeText').innerText = now.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClockAndDate, 1000);
    updateClockAndDate();

    function parseWeather(code) {
      if (code === 0) return { label: 'Zonnig', type: 'sun', icon: icons.sun };
      if (code >= 1 && code <= 3) return { label: 'Bewolkt', type: 'cloud', icon: icons.cloud };
      if (code >= 45 && code <= 48) return { label: 'Mistig', type: 'mist', icon: icons.mist };
      if (code >= 51 && code <= 67) return { label: 'Regen', type: 'rain', icon: icons.rain };
      if (code >= 80 && code <= 82) return { label: 'Buien', type: 'rain', icon: icons.rain };
      if (code >= 95) return { label: 'Onweer', type: 'thunder', icon: icons.thunder };
      return { label: 'Bewolkt', type: 'cloud', icon: icons.cloud };
    }

    async function fetchWeatherData() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        const cur = data.current;

        const weatherInfo = parseWeather(cur.weather_code);
        activeAtmosphere = weatherInfo.type;
        initParticles();

        document.getElementById('condMain').innerText = weatherInfo.label;
        document.getElementById('tempMain').innerText = `${Math.round(cur.temperature_2m)}°C`;
        document.getElementById('feelsMain').innerText = `GEVOELSTEMPERATUUR: ${Math.round(cur.apparent_temperature)}°C`;
        document.getElementById('subCondText').innerText = weatherInfo.label;
        document.getElementById('subCondIcon').innerHTML = weatherInfo.icon;
        
        const precipProb = data.daily?.precipitation_probability_max?.[0] ?? 0;
        document.getElementById('subRainText').innerText = `Regen - ${precipProb}%`;
        document.getElementById('precipVal').innerText = `${precipProb}%`;

        document.getElementById('humidityVal').innerText = `${cur.relative_humidity_2m}%`;
        document.getElementById('windVal').innerText = `${Math.round(cur.wind_speed_10m)} km/h`;
        document.getElementById('windText').innerText = `Richting: ${cur.wind_direction_10m}°`;
        
        document.getElementById('compassNeedle').style.transform = `rotate(${cur.wind_direction_10m}deg)`;

        if (data.daily && data.daily.sunrise && data.daily.sunset) {
          document.getElementById('sunriseTime').innerText = new Date(data.daily.sunrise[0]).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
          document.getElementById('sunsetTime').innerText = new Date(data.daily.sunset[0]).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
        }

        const currentHourIndex = new Date().getHours();
        const hourlyStrip = document.getElementById('hourlyStrip');
        hourlyStrip.innerHTML = '';

        for (let i = 0; i < 8; i++) {
          const idx = currentHourIndex + i;
          if (data.hourly && data.hourly.temperature_2m[idx]) {
            const timeLabel = i === 0 ? 'Nu' : `${(currentHourIndex + i) % 24}:00`;
            const tempVal = `${Math.round(data.hourly.temperature_2m[idx])}°`;
            const hInfo = parseWeather(data.hourly.weather_code[idx]);

            hourlyStrip.innerHTML += `
              <div class="hourly-col">
                <span class="hourly-time">${timeLabel}</span>
                <span class="hourly-icon">${hInfo.icon}</span>
                <span class="hourly-temp">${tempVal}</span>
              </div>
            `;
          }
        }
      } catch (err) {
        console.error(err);
      }
    }

    resizeCanvas();
    drawAtmosphere();
    fetchWeatherData();
    setInterval(fetchWeatherData, 15 * 60 * 1000);
  </script>
</body>
</html>
