<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>NOS Weer Enter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0b0f17;
      color: #ffffff;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* TOP HERO CARD */
    .hero-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(10px);
    }

    .hero-left h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .condition-title {
      font-size: 18px;
      font-weight: 600;
      color: #e30613; /* NOS Red */
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .temp-large {
      font-size: 42px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -1px;
    }

    .feels-like {
      font-size: 10px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    .hero-right {
      text-align: right;
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      padding-left: 16px;
    }

    .date-text {
      font-size: 12px;
      color: #aaaaaa;
      font-weight: 500;
      margin-bottom: 2px;
    }

    .time-text {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .hero-sub-info {
      font-size: 11px;
      color: #888888;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    /* HOURLY FORECAST STRIP */
    .hourly-container {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
    }

    .hourly-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .hourly-time { font-size: 10px; color: #888; font-weight: 600; }
    .hourly-icon { font-size: 15px; }
    .hourly-temp { font-size: 13px; font-weight: 700; }

    /* STATS GRID (2x3 Layout) */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 105px;
    }

    .stat-header {
      font-size: 10px;
      font-weight: 700;
      color: #888888;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-main-val {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.1;
    }

    .stat-footer-text {
      font-size: 10px;
      color: #999999;
    }

    /* COMPASS */
    .compass-box {
      position: relative;
      width: 40px;
      height: 40px;
      border: 2px dashed rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      align-self: flex-end;
      margin-top: -30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .compass-needle {
      width: 3px;
      height: 18px;
      background: #e30613;
      border-radius: 2px;
      transform-origin: bottom center;
      position: absolute;
      bottom: 18px;
    }

    /* SUN ARC */
    .sun-arc-container {
      position: relative;
      height: 25px;
      margin-top: 6px;
    }
    .sun-curve {
      width: 100%;
      height: 15px;
      border-bottom: 2px solid rgba(255,255,255,0.2);
      border-radius: 0 0 50% 50%;
    }

    /* AQI BAR */
    .aqi-bar {
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, #4cd137, #fbc531, #e84118);
      border-radius: 3px;
      position: relative;
      margin-top: 8px;
    }
    .aqi-pointer {
      width: 10px;
      height: 10px;
      background: #ffffff;
      border: 2px solid #0f131a;
      border-radius: 50%;
      position: absolute;
      top: -2.5px;
      left: 35%;
    }
  </style>
</head>
<body>

  <!-- TOP HERO CARD -->
  <div class="hero-card">
    <div class="hero-left">
      <h1>📍 Enter</h1>
      <div class="condition-title" id="condMain">Bewolkt</div>
      <div class="temp-large" id="tempMain">--°C</div>
      <div class="feels-like" id="feelsMain">GEVOELSTEMPERATUUR: --°C</div>
    </div>
    <div class="hero-right">
      <div class="date-text" id="dateText">--</div>
      <div class="time-text" id="timeText">--:--</div>
      <div class="hero-sub-info">
        <span id="subCond">☁️ Bewolkt</span>
        <span id="subRain">🌧️ Regen - 0%</span>
      </div>
    </div>
  </div>

  <!-- HOURLY STRIP -->
  <div class="hourly-container" id="hourlyStrip">
    <!-- Populated via JS -->
  </div>

  <!-- STATS GRID 2x3 -->
  <div class="stats-grid">
    <!-- LUCHTVOCHTIGHEID -->
    <div class="stat-card">
      <div class="stat-header">💧 Luchtvochtigheid</div>
      <div>
        <div class="stat-main-val" id="humidityVal">--%</div>
        <div class="stat-footer-text" id="dewPoint">Relatieve luchtvochtigheid</div>
      </div>
    </div>

    <!-- NEERSLAG -->
    <div class="stat-card">
      <div class="stat-header">🌧️ Neerslagkans</div>
      <div>
        <div class="stat-main-val" id="precipVal">--%</div>
        <div class="stat-footer-text">Verwachting vandaag</div>
      </div>
    </div>

    <!-- WIND -->
    <div class="stat-card">
      <div class="stat-header">💨 Wind</div>
      <div>
        <div class="stat-main-val" id="windVal" style="font-size: 20px;">-- km/h</div>
        <div class="stat-footer-text" id="windText">Richting: --</div>
      </div>
      <div class="compass-box">
        <div class="compass-needle" id="compassNeedle"></div>
      </div>
    </div>

    <!-- DAGLICHT -->
    <div class="stat-card">
      <div class="stat-header">☀️ Daglicht</div>
      <div>
        <div class="sun-arc-container">
          <div class="sun-curve"></div>
        </div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 9px; color: #aaa;">
        <span>Opkomst: <b id="sunriseTime">07:45</b></span>
        <span>Ondergang: <b id="sunsetTime">16:49</b></span>
      </div>
    </div>

    <!-- ZICHT -->
    <div class="stat-card">
      <div class="stat-header">👁️ Zicht</div>
      <div>
        <div class="stat-main-val">10 km</div>
        <div class="stat-footer-text">Uitstekend zicht</div>
      </div>
    </div>

    <!-- LUCHTKWALITEIT -->
    <div class="stat-card">
      <div class="stat-header">🍃 Luchtkwaliteit</div>
      <div>
        <div class="stat-main-val" style="font-size: 22px;">3 <span style="font-size: 12px; font-weight: 500; color:#fbc531;">Matig</span></div>
        <div class="aqi-bar">
          <div class="aqi-pointer"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const LAT = 52.2961;
    const LON = 6.5786;
    const API_URL = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,weather_code&daily=sunrise,sunset,precipitation_probability_max&timezone=Europe%2FAmsterdam`;

    function updateClockAndDate() {
      const now = new Date();
      const optionsDate = { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' };
      document.getElementById('dateText').innerText = now.toLocaleDateString('nl-NL', optionsDate);
      document.getElementById('timeText').innerText = now.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClockAndDate, 1000);
    updateClockAndDate();

    function getWeatherEmoji(code) {
      if (code === 0) return '☀️';
      if (code >= 1 && code <= 3) return '☁️';
      if (code >= 45 && code <= 48) return '🌫️';
      if (code >= 51 && code <= 67) return '🌧️';
      if (code >= 80 && code <= 82) return '🌦️';
      if (code >= 95) return '⚡';
      return '☁️';
    }

    function getWeatherLabel(code) {
      if (code === 0) return 'Zonnig';
      if (code >= 1 && code <= 3) return 'Bewolkt';
      if (code >= 45 && code <= 48) return 'Mistig';
      if (code >= 51 && code <= 67) return 'Regen';
      if (code >= 80 && code <= 82) return 'Buien';
      if (code >= 95) return 'Onweer';
      return 'Bewolkt';
    }

    async function fetchWeatherData() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        const cur = data.current;

        const label = getWeatherLabel(cur.weather_code);
        const icon = getWeatherEmoji(cur.weather_code);

        document.getElementById('condMain').innerText = label;
        document.getElementById('tempMain').innerText = `${Math.round(cur.temperature_2m)}°C`;
        document.getElementById('feelsMain').innerText = `GEVOELSTEMPERATUUR: ${Math.round(cur.apparent_temperature)}°C`;
        document.getElementById('subCond').innerText = `${icon} ${label}`;
        
        const precipProb = data.daily?.precipitation_probability_max?.[0] ?? 0;
        document.getElementById('subRain').innerText = `🌧️ Regen - ${precipProb}%`;
        document.getElementById('precipVal').innerText = `${precipProb}%`;

        document.getElementById('humidityVal').innerText = `${cur.relative_humidity_2m}%`;
        document.getElementById('windVal').innerText = `${Math.round(cur.wind_speed_10m)} km/h`;
        document.getElementById('windText').innerText = `Richting: ${cur.wind_direction_10m}°`;
        
        document.getElementById('compassNeedle').style.transform = `rotate(${cur.wind_direction_10m}deg)`;

        // Sunrise & Sunset formatting
        if (data.daily && data.daily.sunrise && data.daily.sunset) {
          const sunriseStr = new Date(data.daily.sunrise[0]).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
          const sunsetStr = new Date(data.daily.sunset[0]).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
          document.getElementById('sunriseTime').innerText = sunriseStr;
          document.getElementById('sunsetTime').innerText = sunsetStr;
        }

        // Hourly Strip (Next 8 hours)
        const currentHourIndex = new Date().getHours();
        const hourlyStrip = document.getElementById('hourlyStrip');
        hourlyStrip.innerHTML = '';

        for (let i = 0; i < 8; i++) {
          const idx = currentHourIndex + i;
          if (data.hourly && data.hourly.temperature_2m[idx]) {
            const timeLabel = i === 0 ? 'Nu' : `${(currentHourIndex + i) % 24}:00`;
            const tempVal = `${Math.round(data.hourly.temperature_2m[idx])}°`;
            const hIcon = getWeatherEmoji(data.hourly.weather_code[idx]);

            hourlyStrip.innerHTML += `
              <div class="hourly-col">
                <span class="hourly-time">${timeLabel}</span>
                <span class="hourly-icon">${hIcon}</span>
                <span class="hourly-temp">${tempVal}</span>
              </div>
            `;
          }
        }
      } catch (err) {
        console.error(err);
      }
    }

    fetchWeatherData();
    setInterval(fetchWeatherData, 15 * 60 * 1000);
  </script>
</body>
</html>
