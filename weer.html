<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Geanimeerd Weer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0d0d0d;
      color: #ffffff;
    }

    /* FULLSCREEN CANVAS ANIMATION LAYER */
    #weatherCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* UI OVERLAY CONTAINER */
    .weather-overlay {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100vh;
      background: linear-gradient(180deg, rgba(17,17,17,0.7) 0%, rgba(10,10,10,0.88) 100%);
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(4px);
    }

    .location-tag {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .condition-tag {
      color: #e30613; /* NOS Red Accent */
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    /* MAIN TEMP DISPLAY */
    .hero-temp {
      margin: 20px 0;
    }

    .temp-number {
      font-size: 72px;
      font-weight: 800;
      line-height: 1;
      text-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .temp-feels {
      font-size: 15px;
      color: #bbbbbb;
      margin-top: 8px;
    }

    /* HOURLY FORECAST STRIP */
    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: #888888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .hourly-strip {
      display: flex;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      padding: 12px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 15px;
    }

    .hourly-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .hourly-time { font-size: 12px; color: #aaaaaa; }
    .hourly-temp { font-size: 15px; font-weight: 700; }

    /* GRID STATS BOXES */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      padding: 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 11px;
      color: #888888;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
    }

    .stat-sub {
      font-size: 11px;
      color: #aaaaaa;
      margin-top: 3px;
    }
  </style>
</head>
<body>

  <!-- BACKGROUND ANIMATION CANVAS -->
  <canvas id="weatherCanvas"></canvas>

  <!-- WEATHER UI OVERLAY -->
  <div class="weather-overlay">
    <div>
      <div class="location-tag" id="locTag">Enter</div>
      <div class="condition-tag" id="condTag">Laden...</div>

      <div class="hero-temp">
        <div class="temp-number" id="tempMain">--°C</div>
        <div class="temp-feels" id="tempFeels">Gevoel: --°C</div>
      </div>
    </div>

    <!-- HOURLY STRIP -->
    <div>
      <div class="section-title">Verwachting komende uren</div>
      <div class="hourly-strip" id="hourlyStrip"></div>
    </div>

    <!-- METRICS GRID -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Luchtvochtigheid</span>
        <span class="stat-value" id="humidity">--%</span>
        <span class="stat-sub">Relatief</span>
      </div>

      <div class="stat-card">
        <span class="stat-label">Neerslagkans</span>
        <span class="stat-value" id="precipProb">--%</span>
        <span class="stat-sub" id="precipVal">0 mm</span>
      </div>

      <div class="stat-card">
        <span class="stat-label">Wind</span>
        <span class="stat-value" id="windSpeed">-- km/h</span>
        <span class="stat-sub" id="windDir">Richting: --</span>
      </div>

      <div class="stat-card">
        <span class="stat-label">UV Index</span>
        <span class="stat-value" id="uvIndex">--</span>
        <span class="stat-sub" id="uvRisk">Laag</span>
      </div>
    </div>
  </div>

  <script>
    // ENTER, OVERIJSSEL COORDINATES
    const LAT = 52.2961;
    const LON = 6.5786;
    const API_URL = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m&hourly=temperature_2m&daily=uv_index_max,precipitation_probability_max&timezone=Europe%2FAmsterdam`;

    let activeCondition = 'sun'; // 'sun', 'rain', 'cloud', 'thunder'

    // CANVAS ENGINE
    const canvas = document.getElementById('weatherCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let animationFrameId;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initParticles();
    }
    window.addEventListener('resize', resizeCanvas);

    function initParticles() {
      particles = [];
      const count = activeCondition === 'rain' ? 120 : (activeCondition === 'sun' ? 25 : 40);

      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: activeCondition === 'rain' ? Math.random() * 2 + 1 : Math.random() * 40 + 20,
          speedY: activeCondition === 'rain' ? Math.random() * 8 + 10 : Math.random() * 0.3 - 0.15,
          speedX: activeCondition === 'rain' ? Math.random() * 1 - 0.5 : Math.random() * 0.4 + 0.1,
          opacity: Math.random() * 0.5 + 0.2
        });
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (activeCondition === 'rain' || activeCondition === 'thunder') {
        // Draw Rain Droplets
        ctx.strokeStyle = 'rgba(180, 220, 255, 0.6)';
        ctx.lineWidth = 1.5;
        particles.forEach(p => {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x + p.speedX * 2, p.y + p.size * 5);
          ctx.stroke();

          p.y += p.speedY;
          p.x += p.speedX;

          if (p.y > canvas.height) {
            p.y = -20;
            p.x = Math.random() * canvas.width;
          }
        });

        // Lightning Flash Effect for Thunderstorms
        if (activeCondition === 'thunder' && Math.random() < 0.015) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

      } else if (activeCondition === 'sun') {
        // Glowing Floating Sun Orbs
        particles.forEach(p => {
          ctx.beginPath();
          const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
          gradient.addColorStop(0, `rgba(255, 183, 3, ${p.opacity})`);
          gradient.addColorStop(1, 'rgba(255, 183, 3, 0)');
          ctx.fillStyle = gradient;
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();

          p.x += p.speedX;
          p.y += p.speedY;

          if (p.x > canvas.width + 50) p.x = -50;
          if (p.y > canvas.height + 50) p.y = -50;
        });

      } else {
        // Slow Drifting Clouds
        particles.forEach(p => {
          ctx.beginPath();
          const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 2);
          gradient.addColorStop(0, `rgba(200, 200, 200, ${p.opacity * 0.3})`);
          gradient.addColorStop(1, 'rgba(200, 200, 200, 0)');
          ctx.fillStyle = gradient;
          ctx.arc(p.x, p.y, p.size * 2, 0, Math.PI * 2);
          ctx.fill();

          p.x += p.speedX;

          if (p.x > canvas.width + 100) p.x = -100;
        });
      }

      animationFrameId = requestAnimationFrame(animate);
    }

    function parseWeatherCode(code) {
      if (code === 0) return { label: 'Zonnig', type: 'sun' };
      if (code >= 1 && code <= 3) return { label: 'Bewolkt', type: 'cloud' };
      if (code >= 45 && code <= 48) return { label: 'Mistig', type: 'cloud' };
      if (code >= 51 && code <= 67) return { label: 'Regen', type: 'rain' };
      if (code >= 80 && code <= 82) return { label: 'Buien', type: 'rain' };
      if (code >= 95) return { label: 'Onweer', type: 'thunder' };
      return { label: 'Bewolkt', type: 'cloud' };
    }

    function windDegToText(deg) {
      const dirs = ['N', 'NO', 'O', 'ZO', 'Z', 'ZW', 'W', 'NW'];
      return dirs[Math.round(deg / 45) % 8];
    }

    async function fetchWeather() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        const current = data.current;

        const cond = parseWeatherCode(current.weather_code);
        activeCondition = cond.type;
        initParticles();

        document.getElementById('condTag').innerText = cond.label;
        document.getElementById('tempMain').innerText = `${Math.round(current.temperature_2m)}°C`;
        document.getElementById('tempFeels').innerText = `Gevoel: ${Math.round(current.apparent_temperature)}°C`;

        document.getElementById('humidity').innerText = `${current.relative_humidity_2m}%`;

        const precipProb = data.daily?.precipitation_probability_max?.[0] ?? 0;
        document.getElementById('precipProb').innerText = `${precipProb}%`;
        document.getElementById('precipVal').innerText = `${current.precipitation} mm nu`;

        document.getElementById('windSpeed').innerText = `${Math.round(current.wind_speed_10m)} km/h`;
        document.getElementById('windDir').innerText = `Richting: ${windDegToText(current.wind_direction_10m)}`;

        const uv = data.daily?.uv_index_max?.[0] ?? 0;
        document.getElementById('uvIndex').innerText = uv.toFixed(1);
        document.getElementById('uvRisk').innerText = uv > 5 ? 'Hoog' : (uv > 2 ? 'Matig' : 'Laag');

        // Render 5-hour strip
        const currentHour = new Date().getHours();
        const hourlyStrip = document.getElementById('hourlyStrip');
        hourlyStrip.innerHTML = '';

        for (let i = 1; i <= 5; i++) {
          const hIdx = currentHour + i;
          if (data.hourly && data.hourly.time[hIdx]) {
            hourlyStrip.innerHTML += `
              <div class="hourly-item">
                <span class="hourly-time">${(currentHour + i) % 24}:00</span>
                <span class="hourly-temp">${Math.round(data.hourly.temperature_2m[hIdx])}°</span>
              </div>
            `;
          }
        }
      } catch (err) {
        document.getElementById('condTag').innerText = 'Fout bij laden';
      }
    }

    resizeCanvas();
    animate();
    fetchWeather();
    setInterval(fetchWeather, 15 * 60 * 1000); // 15 min refresh
  </script>
</body>
</html>
