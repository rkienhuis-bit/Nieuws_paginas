<script>
    const RSS_URL = 'https://feeds.nos.nl/nosnieuwsbinnenland'; // Change per category file
    const CATEGORY_LABEL = 'BINNENLAND';                         // Change per category file
    const STORAGE_KEY_INDEX = 'nos_cat_index_binnenland';        // Use a unique key per category (e.g. _buitenland, _politiek, _sport)
    const STORAGE_KEY_ITEMS = 'nos_cat_items_binnenland';

    const API_URL = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(RSS_URL);
    let items = [];
    let currentIndex = 0;
    let timerId = null;
    let scrollTimeout = null;

    // Load saved index from browser memory if it exists
    const savedIndex = localStorage.getItem(STORAGE_KEY_INDEX);
    if (savedIndex !== null) {
      currentIndex = parseInt(savedIndex, 10);
    }

    function extractImage(item) {
      if (item.thumbnail) return item.thumbnail;
      if (item.enclosure && item.enclosure.link) return item.enclosure.link;
      const imgMatch = item.description ? item.description.match(/<img[^>]+src="([^">]+)"/) : null;
      return imgMatch ? imgMatch[1] : null;
    }

    function formatDescription(html) {
      if (!html) return '';
      const div = document.createElement("div");
      div.innerHTML = html;
      const text = div.textContent || div.innerText || "";
      const paragraphs = text.split(/\r?\n\r?/);
      
      return paragraphs
        .map(p => p.trim())
        .filter(p => p.length > 0)
        .map(p => `<p>${p}</p>`)
        .join('');
    }

    function calculateReadingDuration(title, descriptionHtml) {
      const div = document.createElement("div");
      div.innerHTML = descriptionHtml;
      const plainText = div.textContent || div.innerText || "";
      const wordCount = (title + " " + plainText).split(/\s+/).length;
      
      let durationMs = 12000; 
      durationMs += wordCount * 300; 
      
      if (durationMs < 14000) durationMs = 14000;
      if (durationMs > 35000) durationMs = 35000;
      return durationMs;
    }

    function renderCurrentStory() {
      if (items.length === 0) return;
      if (timerId) clearTimeout(timerId);
      
      // Ensure index is within bounds of the fetched items array
      if (currentIndex >= items.length) {
        currentIndex = 0;
      }

      const card = document.getElementById('newsCard');
      card.classList.add('slide-out');

      setTimeout(() => {
        const item = items[currentIndex];
        const imgUrl = extractImage(item);
        const imgEl = document.getElementById('newsImg');
        const descEl = document.getElementById('newsDesc');
        const descWrapper = document.getElementById('descWrapper');
        const qrContainer = document.getElementById('qrContainer');
        const qrImg = document.getElementById('qrImg');

        // Image Handling
        if (imgUrl) {
          imgEl.src = imgUrl;
          imgEl.style.display = 'block';
          document.getElementById('imgContainer').style.display = 'block';
        } else {
          imgEl.style.display = 'none';
          document.getElementById('imgContainer').style.display = 'none';
        }

        // QR Code Handling
        const storyUrl = item.link || item.guid;
        if (storyUrl) {
          qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + encodeURIComponent(storyUrl);
          qrContainer.style.display = 'flex';
        } else {
          qrContainer.style.display = 'none';
        }

        // Content & Header
        document.getElementById('newsCat').innerText = CATEGORY_LABEL;
        document.getElementById('newsTitle').innerText = item.title;
        
        // Reset Text Scroll Position & Insert Full Description
        descEl.style.transition = 'none';
        descEl.style.transform = 'translateY(0px)';
        descEl.innerHTML = formatDescription(item.description);

        card.classList.add('slide-in');
        card.classList.remove('slide-out');
        void card.offsetWidth;
        card.classList.remove('slide-in');

        const currentStoryDuration = calculateReadingDuration(item.title, item.description);

        // Proportional Scroll Logic
        if (scrollTimeout) clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(() => {
          const textHeight = descEl.offsetHeight;
          const containerHeight = descWrapper.offsetHeight;
          
          if (textHeight > containerHeight) {
            const scrollDistance = textHeight - containerHeight + 25;
            const scrollTime = Math.max(8, (currentStoryDuration - 6000) / 1000); 
            
            descEl.style.transition = `transform ${scrollTime}s linear`;
            descEl.style.transform = `translateY(-${scrollDistance}px)`;
          }
        }, 4500);

        // Advance to next index and save it to memory
        currentIndex = (currentIndex + 1) % items.length;
        localStorage.setItem(STORAGE_KEY_INDEX, currentIndex);

        timerId = setTimeout(renderCurrentStory, currentStoryDuration);
      }, 800);
    }

    async function fetchRSS() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        if (data.status === 'ok' && data.items.length > 0) {
          items = data.items;
          localStorage.setItem(STORAGE_KEY_ITEMS, JSON.stringify(items));
          
          // If stories haven't started playing yet, trigger the first render
          if (!timerId) {
            renderCurrentStory();
          }
        } else {
          loadCachedData();
        }
      } catch (err) {
        loadCachedData();
      }
    }

    function loadCachedData() {
      const cached = localStorage.getItem(STORAGE_KEY_ITEMS);
      if (cached) {
        items = JSON.parse(cached);
        if (!timerId) {
          renderCurrentStory();
        }
      } else {
        document.getElementById('newsTitle').innerText = 'Fout bij het laden van het nieuws.';
      }
    }

    // Initialize instantly from local cache if available, then fetch fresh data in background
    loadCachedData();
    fetchRSS();
    setInterval(fetchRSS, 10 * 60 * 1000); // Check for feed updates every 10 minutes
  </script>
