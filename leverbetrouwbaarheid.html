<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leverbetrouwbaarheid 2026</title>

  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #333333;
      --text-muted: #666666;
      --line-color: #3b82f6;
      --target-color: #ef4444;
      --grid-color: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #374151;
      letter-spacing: -0.5px;
    }

    /* Main Container */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Top Chart Section */
    .top-chart-container {
      flex: 3;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px 24px 8px 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .chart-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
    }

    /* Bottom Donuts Section */
    .bottom-cards-container {
      flex: 2;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #4b5563;
      text-align: center;
    }

    .card-subtitle {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-top: 2px;
    }

    .donut-wrapper {
      position: relative;
      width: 150px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px 0;
    }
