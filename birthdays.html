<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Team Verjaardagen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #090d16;
      color: #ffffff;
    }

    /* ORGANIC FLUID BACKGROUND AMBIANCE */
    #ambientCanvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* FULL-SCREEN EDITORIAL CONTAINER */
    .screen-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100vh;
      padding: 60px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* HEADER SECTION */
    .header-group {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 24px;
      animation: fadeInDown 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .title-box h1 {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .title-box p {
      font-size: 15px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
    }

    .date-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 600;
      color: #38bdf8;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    /* MAIN CONTENT VIEW */
    .main-content {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }

    /* MONTHLY GRID VIEW (MULTI-COLUMN EDITORIAL STYLE) */
    .monthly-grid-layout {
      width: 100%;
      max-height: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      overflow-y: auto;
      padding: 10px 4px;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 6px; }

    .person-card {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 24px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    .person-card:hover {
      background: rgba(255, 255, 255, 0.045);
      border-color: rgba(56, 189, 248, 0.3);
      transform: translateY(-3px);
    }

    .person-info h3 {
      font-size: 18px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 4px;
    }

    .person-info span {
      font-size: 12px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .person-date-badge {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.15);
      padding: 8px 16px;
      border-radius: 12px;
    }

    /* TODAY CELEBRATION HERO VIEW */
    .celebration-feature {
      width: 100%;
      max-width: 700px;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.8) 100%);
      border: 1px solid rgba(245, 158, 11, 0.3);
      backdrop-filter: blur(25px);
      border-radius: 32px;
      padding: 50px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      animation: scaleIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .celeb-badge {
      display: inline-block;
      font-size: 14px;
      font-weight: 700;
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.25);
      padding: 8px 20px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 24px;
    }

    .celeb-name {
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #ffffff;
      margin-bottom: 16px;
    }

    .celeb-wish {
      font-size: 20px;
      color: #cbd5e1;
      font-weight: 400;
      line-height: 1.5;
    }

    /* KEYFRAMES */
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- FLUID ORGANIC AMBIENT CANVAS -->
  <canvas id="ambientCanvas"></canvas>

  <div class="screen-wrapper">
    <!-- HEADER -->
    <div class="header-group">
      <div class="title-box">
        <h1 id="mainTitle">Verjaardagen deze maand</h1>
        <p id="subTitle">Team Overzicht</p>
      </div>
      <div class="date-pill" id="datePill">--</div>
    </div>

    <!-- MAIN DYNAMIC CONTENT -->
    <div class="main-content" id="contentArea">
      <!-- Injected via JS -->
    </div>
  </div>

  <script>
    const birthdays = [
      { name: "Laila van Oversteeg", month: 1, day: 19 },
      { name: "Malgorzata Witczak", month: 2, day: 9 },
      { name: "Wendy Slag", month: 2, day: 13 },
      { name: "Robert Markvoort", month: 2, day: 22 },
      { name: "Sander Bremer", month: 3, day: 5 },
      { name: "Arjan Dijkstra", month: 3, day: 16 },
      { name: "Anja Hoevink-Zwijnenberg", month: 3, day: 25 },
      { name: "Florus van den Berge", month: 4, day: 2 },
      { name: "Remco Grondhuis", month: 4, day: 10 },
      { name: "Christoph Ahlers", month: 4, day: 19 },
      { name: "Lieke van Horssen", month: 4, day: 23 },
      { name: "Pim van Oppen", month: 5, day: 4 },
      { name: "Jeroen Schuitemaker", month: 5, day: 9 },
      { name: "Manfred Zeides", month: 5, day: 12 },
      { name: "Martijn Steunenberg", month: 5, day: 14 },
      { name: "Laurents ten Voorde", month: 5, day: 15 },
      { name: "Antoinette Geels", month: 5, day: 25 },
      { name: "Levan Hendriks", month: 6, day: 7 },
      { name: "Maud Meilink", month: 6, day: 17 },
      { name: "Linda Drost", month: 6, day: 18 },
      { name: "Tico van der Linde", month: 6, day: 19 },
      { name: "Gerald Wijnen", month: 6, day: 19 },
      { name: "Ansjelo Gerritsen", month: 7, day: 1 },
      { name: "Marwan hersi", month: 7, day: 8 },
      { name: "Edwin Hüsing", month: 7, day: 29 },
      { name: "Kevin Keizer", month: 8, day: 3 },
      { name: "Iné van Dijk", month: 8, day: 6 },
      { name: "Peter Karssies", month: 9, day: 6 },
      { name: "Gerwin Meilink", month: 9, day: 9 },
      { name: "Raymond van Dijk", month: 9, day: 24 },
      { name: "Kevin van Elven", month: 10, day: 10 },
      { name: "Tim Zwiers", month: 10, day: 11 },
      { name: "Stefan Boekhorst", month: 10, day: 16 },
      { name: "Gilbert Rada", month: 11, day: 12 },
      { name: "Desiree Wissink", month: 11, day: 12 },
      { name: "Marco Vooijs", month: 11, day: 30 },
      { name: "Roy Kienhuis", month: 12, day: 24 },
      { name: "Fenny Voortman - Lohuis", month: 12, day: 30 },
      { name: "Ilona Pigge - Maatje", month: 12, day: 31 }
    ];

    const dutchMonths = [
      "januari", "februari", "maart", "april", "mei", "juni", 
      "juli", "augustus", "september", "oktober", "november", "december"
    ];

    const professionalWishes = [
      "Van harte gefeliciteerd met je verjaardag!",
      "Een fijne verjaardag toegewenst namens het hele team!",
      "Gefeliciteerd! Maak er een fantastische dag van!",
      "Heel fijne verjaardag gewenst!"
    ];

    // ORGANIC FLUID BACKGROUND ANIMATION
    const canvas = document.getElementById('ambientCanvas');
    const ctx = canvas.getContext('2d');
    let orbs = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initOrbs();
    }
    window.addEventListener('resize', resizeCanvas);

    function initOrbs() {
      orbs = [];
      for (let i = 0; i < 4; i++) {
        orbs.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 300 + 200,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          color: i % 2 === 0 ? 'rgba(14, 116, 144, 0.12)' : 'rgba(30, 58, 138, 0.15)'
        });
      }
    }

    function animateOrbs() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      orbs.forEach(orb => {
        ctx.beginPath();
        const grad = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, orb.radius);
        grad.addColorStop(0, orb.color);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.arc(orb.x, orb.y, orb.radius, 0, Math.PI * 2);
        ctx.fill();

        orb.x += orb.vx;
        orb.y += orb.vy;

        if (orb.x < -100 || orb.x > canvas.width + 100) orb.vx *= -1;
        if (orb.y < -100 || orb.y > canvas.height + 100) orb.vy *= -1;
      });
      requestAnimationFrame(animateOrbs);
    }

    function renderPage() {
      const now = new Date();
      const currentDay = now.getDate();
      const currentMonth = now.getMonth() + 1;

      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('datePill').innerText = now.toLocaleDateString('nl-NL', options);

      const todaysBirthdays = birthdays.filter(b => b.month === currentMonth && b.day === currentDay);
      const contentArea = document.getElementById('contentArea');

      if (todaysBirthdays.length > 0) {
        document.getElementById('mainTitle').innerText = "Jarig Vandaag! 🎉";
        document.getElementById('subTitle').innerText = "Speciale viering";

        let html = '';
        todaysBirthdays.forEach(person => {
          const wish = professionalWishes[person.name.length % professionalWishes.length];
          html += `
            <div class="celebration-feature">
              <div class="celeb-badge">Vandaag in de spotlight</div>
              <div class="celeb-name">${person.name}</div>
              <div class="celeb-wish">${wish} We wensen je een fantastisch jaar toe!</div>
            </div>
          `;
        });
        contentArea.innerHTML = html;
      } else {
        document.getElementById('mainTitle').innerText = "Verjaardagen deze maand";
        document.getElementById('subTitle').innerText = dutchMonths[currentMonth - 1].toUpperCase();

        const monthlyBirthdays = birthdays.filter(b => b.month === currentMonth);
        monthlyBirthdays.sort((a, b) => a.day - b.day);

        if (monthlyBirthdays.length === 0) {
          contentArea.innerHTML = `<div style="color: #64748b; font-size: 18px;">Geen verjaardagen in deze maand.</div>`;
        } else {
          let gridHtml = `<div class="monthly-grid-layout">`;
          monthlyBirthdays.forEach((person, index) => {
            const delay = index * 0.08;
            gridHtml += `
              <div class="person-card" style="animation-delay: ${delay}s">
                <div class="person-info">
                  <h3>${person.name}</h3>
                  <span>Collega</span>
                </div>
                <div class="person-date-badge">${person.day} ${dutchMonths[currentMonth - 1]}</div>
              </div>
            `;
          });
          gridHtml += `</div>`;
          contentArea.innerHTML = gridHtml;
        }
      }
    }

    resizeCanvas();
    animateOrbs();
    renderPage();
    setInterval(renderPage, 60 * 1000);
  </script>
</body>
</html>
