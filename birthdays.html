<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Verjaardagen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0b0f19;
      color: #ffffff;
    }

    /* VIBRANT AMBIENT BACKGROUND & CONFETTI CANVAS */
    .bg-gradient {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 80% 20%, rgba(245, 158, 11, 0.08) 0%, rgba(11, 15, 25, 1) 70%),
                  radial-gradient(circle at 20% 80%, rgba(56, 189, 248, 0.06) 0%, rgba(11, 15, 25, 1) 70%);
      z-index: 1;
      pointer-events: none;
    }
    #confettiCanvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    /* FULL-SCREEN EDITORIAL CONTAINER */
    .screen-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100vh;
      padding: 45px 60px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* EDITORIAL HEADER */
    .header-group {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 20px;
    }

    .title-box h1 {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .title-box p {
      font-size: 13px;
      color: #f59e0b;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
    }

    .date-display {
      font-size: 15px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    /* TEST MODE BANNER */
    .test-banner {
      position: fixed;
      top: 15px; left: 50%; transform: translateX(-50%);
      background: #f59e0b; color: #000;
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
      padding: 4px 12px; border-radius: 4px; z-index: 999;
      display: none;
    }

    /* MAIN CONTENT AREA */
    .main-content {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 0;
      overflow: hidden;
    }

    /* DUOLINGO-STYLE PATH / TIMELINE MAP */
    .path-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 720px;
      overflow-y: auto;
      padding: 20px;
      position: relative;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(245, 158, 11, 0.2); border-radius: 4px; }

    .path-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      width: 100%;
    }

    /* Alternate zig-zag layout for path feel */
    .path-row:nth-child(even) {
      flex-direction: row-reverse;
    }

    .path-node {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      width: 360px;
      backdrop-filter: blur(12px);
      transition: all 0.3s ease;
    }

    .path-node.birthday-node {
      background: rgba(245, 158, 11, 0.08);
      border-color: rgba(245, 158, 11, 0.4);
      box-shadow: 0 10px 30px rgba(245, 158, 11, 0.15);
      animation: pulseNode 3s infinite alternate;
    }

    @keyframes pulseNode {
      0% { box-shadow: 0 10px 20px rgba(245, 158, 11, 0.1); }
      100% { box-shadow: 0 15px 35px rgba(245, 158, 11, 0.25); }
    }

    .node-badge {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #94a3b8;
      flex-shrink: 0;
    }

    .path-node.birthday-node .node-badge {
      background: #f59e0b;
      color: #0b0f19;
      border-color: #f59e0b;
      font-size: 18px;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
    }

    .node-info {
      display: flex;
      flex-direction: column;
    }

    .node-first {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }

    .node-last {
      font-size: 12px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .path-node.birthday-node .node-first {
      color: #f59e0b;
    }

    /* TODAY CELEBRATION FEATURE VIEW */
    .celebration-feature {
      width: 100%;
      max-width: 650px;
      text-align: center;
      padding: 60px 40px;
      background: radial-gradient(circle at 50% 30%, rgba(245, 158, 11, 0.12) 0%, rgba(15, 23, 42, 0) 70%);
      position: relative;
      animation: bounceIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .celebration-feature::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #f59e0b, transparent);
      border-radius: 2px;
    }

    .celeb-tag {
      font-size: 13px;
      font-weight: 700;
      color: #f59e0b;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 20px;
    }

    .celeb-name-large {
      font-size: 64px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -1px;
      margin-bottom: 20px;
      line-height: 1.1;
    }

    .celeb-wish-text {
      font-size: 22px;
      color: #f3f4f6;
      font-weight: 500;
      line-height: 1.5;
    }

    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0.9) translateY(20px); }
      60% { opacity: 1; transform: scale(1.02) translateY(-5px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
  </style>
</head>
<body>

  <div class="test-banner" id="testBanner">Test Mode Actief (?test=true)</div>
  <div class="bg-gradient"></div>
  <canvas id="confettiCanvas"></canvas>

  <div class="screen-wrapper">
    <!-- HEADER -->
    <div class="header-group">
      <div class="title-box">
        <h1 id="mainTitle">Verjaardagen deze maand</h1>
        <p id="subTitle">Team Overzicht</p>
      </div>
      <div class="date-display" id="dateDisplay">--</div>
    </div>

    <!-- CONTENT -->
    <div class="main-content" id="contentArea"></div>
  </div>

  <script>
    const birthdays = [
      { name: "Laila van Oversteeg", month: 1, day: 19 },
      { name: "Malgorzata Witczak", month: 2, day: 9 },
      { name: "Wendy Slag", month: 2, day: 13 },
      { name: "Robert Markvoort", month: 2, day: 22 },
      { name: "Sander Bremer", month: 3, day: 5 },
      { name: "Arjan Dijkstra", month: 3, day: 16 },
      { name: "Anja Hoevink-Zwijnenberg", month: 3, day: 25 },
      { name: "Florus van den Berge", month: 4, day: 2 },
      { name: "Remco Grondhuis", month: 4, day: 10 },
      { name: "Christoph Ahlers", month: 4, day: 19 },
      { name: "Lieke van Horssen", month: 4, day: 23 },
      { name: "Pim van Oppen", month: 5, day: 4 },
      { name: "Jeroen Schuitemaker", month: 5, day: 9 },
      { name: "Manfred Zeides", month: 5, day: 12 },
      { name: "Martijn Steunenberg", month: 5, day: 14 },
      { name: "Laurents ten Voorde", month: 5, day: 15 },
      { name: "Antoinette Geels", month: 5, day: 25 },
      { name: "Levan Hendriks", month: 6, day: 7 },
      { name: "Maud Meilink", month: 6, day: 17 },
      { name: "Linda Drost", month: 6, day: 18 },
      { name: "Tico van der Linde", month: 6, day: 19 },
      { name: "Gerald Wijnen", month: 6, day: 19 },
      { name: "Ansjelo Gerritsen", month: 7, day: 1 },
      { name: "Marwan hersi", month: 7, day: 8 },
      { name: "Edwin Hüsing", month: 7, day: 29 },
      { name: "Kevin Keizer", month: 8, day: 3 },
      { name: "Iné van Dijk", month: 8, day: 6 },
      { name: "Peter Karssies", month: 9, day: 6 },
      { name: "Gerwin Meilink", month: 9, day: 9 },
      { name: "Raymond van Dijk", month: 9, day: 24 },
      { name: "Kevin van Elven", month: 10, day: 10 },
      { name: "Tim Zwiers", month: 10, day: 11 },
      { name: "Stefan Boekhorst", month: 10, day: 16 },
      { name: "Gilbert Rada", month: 11, day: 12 },
      { name: "Desiree Wissink", month: 11, day: 12 },
      { name: "Marco Vooijs", month: 11, day: 30 },
      { name: "Roy Kienhuis", month: 12, day: 24 },
      { name: "Fenny Voortman - Lohuis", month: 12, day: 30 },
      { name: "Ilona Pigge - Maatje", month: 12, day: 31 }
    ];

    const dutchMonths = [
      "januari", "februari", "maart", "april", "mei", "juni", 
      "juli", "augustus", "september", "oktober", "november", "december"
    ];

    function splitName(fullName) {
      const parts = fullName.trim().split(' ');
      if (parts.length === 1) return { first: parts[0], last: '' };
      const last = parts.pop();
      const first = parts.join(' ');
      return { first, last };
    }

    function triggerConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let particles = [];
      const colors = ['#f59e0b', '#38bdf8', '#f43f5e', '#a855f7', '#10b981'];

      for (let i = 0; i < 70; i++) {
        particles.push({
          x: canvas.width / 2 + (Math.random() - 0.5) * 200,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 12,
          vy: Math.random() * -14 - 4,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 10,
          gravity: 0.35,
          opacity: 1
        });
      }

      function update() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.rotation += p.rotSpeed;
          p.opacity -= 0.008;

          if (p.opacity > 0) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.globalAlpha = p.opacity;
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
            ctx.restore();
          }
        });

        if (particles.some(p => p.opacity > 0)) {
          requestAnimationFrame(update);
        }
      }
      update();
    }

    function renderPage() {
      const urlParams = new URLSearchParams(window.location.search);
      const isTestMode = urlParams.get('test') === 'true';

      if (isTestMode) {
        document.getElementById('testBanner').style.display = 'block';
      }

      const now = new Date();
      const currentDay = isTestMode ? 12 : now.getDate();
      const currentMonth = isTestMode ? 11 : now.getMonth() + 1;

      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('dateDisplay').innerText = now.toLocaleDateString('nl-NL', options);

      const todaysBirthdays = birthdays.filter(b => b.month === currentMonth && b.day === currentDay);
      const contentArea = document.getElementById('contentArea');

      if (todaysBirthdays.length > 0) {
        document.getElementById('mainTitle').innerText = "Jarig Vandaag";
        document.getElementById('subTitle').innerText = "";

        let html = '';
        todaysBirthdays.forEach(person => {
          const { first, last } = splitName(person.name);
          html += `
            <div class="celebration-feature">
              <div class="celeb-tag">Vandaag in de spotlight</div>
              <div class="celeb-name-large">${first} <span style="color:#f59e0b; display:block; font-size:42px; margin-top:4px;">${last}</span></div>
              <div class="celeb-wish-text">Van harte gefeliciteerd met je verjaardag!</div>
            </div>
          `;
        });
        contentArea.innerHTML = html;
        setTimeout(triggerConfetti, 200);
      } else {
        document.getElementById('mainTitle').innerText = "Verjaardagen deze maand";
        document.getElementById('subTitle').innerText = dutchMonths[currentMonth - 1].toUpperCase();

        const monthlyBirthdays = birthdays.filter(b => b.month === currentMonth);
        monthlyBirthdays.sort((a, b) => a.day - b.day);

        if (monthlyBirthdays.length === 0) {
          contentArea.innerHTML = `<div style="color: #64748b; font-size: 16px;">Geen verjaardagen in deze maand.</div>`;
        } else {
          // Build Duolingo-style zig-zag path map of birthdays
          let pathHtml = `<div class="path-container">`;
          monthlyBirthdays.forEach(person => {
            const { first, last } = splitName(person.name);
            pathHtml += `
              <div class="path-row">
                <div class="path-node birthday-node">
                  <div class="node-badge">🎈</div>
                  <div class="node-info">
                    <span class="node-first">${first} ${last}</span>
                    <span class="node-last">${person.day} ${dutchMonths[currentMonth - 1]}</span>
                  </div>
                </div>
              </div>
            `;
          });
          pathHtml += `</div>`;
          contentArea.innerHTML = pathHtml;
        }
      }
    }

    renderPage();
    setInterval(renderPage, 60 * 1000);
  </script>
</body>
</html>
