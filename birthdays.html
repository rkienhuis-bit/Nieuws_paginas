
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verjaardagen</title>

<style>
:root {
  --bg: #090e19;
  --navy: #152541;
  --blue: #294c78;
  --blue-bright: #3b82b9;
  --gold: #d9aa60;
  --gold-light: #f1d29b;
  --text: #f1f3f7;
  --muted: #8995a9;
  --line: #26344b;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
    Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

body {
  background:
    radial-gradient(ellipse at 50% 40%, #14223a 0%, transparent 65%),
    linear-gradient(135deg, #090e19, #0c1423);
}

/* BACKGROUND DETAILS */

.bg-glow {
  position: fixed;
  width: 650px;
  height: 650px;
  border-radius: 50%;
  background: rgba(217,170,96,.035);
  filter: blur(100px);
  right: -300px;
  bottom: -350px;
  pointer-events: none;
}

#confettiCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 10;
  pointer-events: none;
}

/* SCREEN */

.screen-wrapper {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100vh;
  padding: 32px 48px 28px;
  display: flex;
  flex-direction: column;
}

/* HEADER */

.header-group {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 23px;
  border-bottom: 1px solid rgba(255,255,255,.10);
  flex-shrink: 0;
}

.title-box h1 {
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -.8px;
  color: #fff;
}

.title-box p {
  font-size: 11px;
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: 3px;
  font-weight: 600;
  margin-top: 7px;
}

.date-display {
  font-size: 15px;
  font-weight: 500;
  color: #9ca9bd;
  letter-spacing: .3px;
}

.test-banner {
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--gold);
  color: #171d29;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 6px 16px;
  border-radius: 3px;
  z-index: 999;
  display: none;
}

/* MAIN CONTENT */

.main-content {
  flex: 1;
  min-height: 0;
  width: 100%;
  display: flex;
  align-items: stretch;
  justify-content: center;
  padding: 18px 0 8px;
  position: relative;
}

/* FULL WIDTH SNAKE GRID */

.snake-grid {
  position: relative;
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  grid-template-rows: repeat(5, minmax(0, 1fr));
  column-gap: 8px;
  row-gap: 5px;
  padding: 4px 0;
  overflow: hidden;
}

/* CONNECTING LINES */

.snake-route {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: visible;
}

.route-shadow {
  fill: none;
  stroke: rgba(0,0,0,.4);
  stroke-width: 9;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.route-line {
  fill: none;
  stroke: #354660;
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.route-highlight {
  fill: none;
  stroke: rgba(255,255,255,.08);
  stroke-width: 1;
  stroke-linecap: round;
}

/* DAY NODES */

.path-node {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 0;
  gap: 9px;
  text-align: center;
}

.node-circle {
  width: 53px;
  height: 53px;
  flex-shrink: 0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;

  background: linear-gradient(145deg, #1a2941, #111d30);
  border: 2px solid #34445d;

  box-shadow:
    0 5px 0 #080e19,
    0 8px 15px rgba(0,0,0,.3);

  color: #aab6c8;
  font-size: 16px;
  font-weight: 700;

  position: relative;
  transition: all .3s ease;
}

/* COMPLETED DAYS */

.path-node.past .node-circle {
  background: linear-gradient(145deg, #315b8d, #203e66);
  border: 2px solid #416b9c;

  color: #e4edf8;

  box-shadow:
    0 5px 0 #142945,
    0 7px 13px rgba(0,0,0,.3);
}

/* TODAY */

.path-node.today .node-circle {
  background: linear-gradient(145deg, #4d91c0, #286b9d);
  border: 2px solid #a5d1ed;

  color: #fff;

  box-shadow:
    0 5px 0 #16466c,
    0 0 24px rgba(76,157,209,.25);

  transform: scale(1.12);
}

/* BIRTHDAY MILESTONE */

.path-node.birthday .node-circle {
  background: linear-gradient(145deg, #d9b477, #a97939);
  border: 2px solid #f0d3a0;

  color: #1c2330;

  box-shadow:
    0 5px 0 #644a2b,
    0 0 20px rgba(217,170,96,.17);
  
  transform: scale(1.1);
}

/* PAST BIRTHDAY */

.path-node.past.birthday .node-circle {
  background: linear-gradient(145deg, #315b8d, #203e66);
  border: 2px solid #d9aa60;
  color: #fff;

  box-shadow:
    0 5px 0 #142945,
    0 7px 13px rgba(0,0,0,.3);
}

/* TODAY BIRTHDAY */

.path-node.today.birthday .node-circle {
  background: linear-gradient(145deg, #e6bd79, #c18a43);
  border: 2px solid #fff0cf;
  color: #1c2330;

  box-shadow:
    0 5px 0 #785326,
    0 0 28px rgba(217,170,96,.4);
}

/* SMALL BIRTHDAY INDICATOR */

.milestone-star {
  position: absolute;
  top: -8px;
  right: -9px;

  width: 20px;
  height: 20px;
  border-radius: 50%;

  background: var(--gold);
  border: 2px solid var(--bg);

  display: flex;
  align-items: center;
  justify-content: center;

  color: #263044;
  font-size: 10px;
  font-weight: 900;
}

/* NODE TEXT */

.node-text {
  width: 100%;
  max-width: 100%;
  padding: 0 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.node-title {
  font-size: 13px;
  font-weight: 650;
  color: #cbd4e1;
  line-height: 1.25;

  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.node-sub {
  font-size: 10px;
  font-weight: 500;
  color: #78879e;
  margin-top: 4px;
  white-space: nowrap;
}

.path-node.birthday .node-title {
  color: var(--gold-light);
}

.path-node.birthday .node-sub {
  color: #b9a17c;
}

.path-node.today .node-title {
  color: #83c6ee;
}

/* BIRTHDAY CELEBRATION */

.celebration-feature {
  width: 100%;
  text-align: center;
  margin: auto;
  padding: 40px 20px;

  background:
    radial-gradient(ellipse at 50% 35%,
    rgba(217,170,96,.11), transparent 65%);

  position: relative;
  animation: bounceIn 1s ease forwards;
}

.celebration-feature::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 130px;
  height: 2px;
  background: linear-gradient(
    90deg, transparent, var(--gold), transparent
  );
}

.celeb-tag {
  font-size: 13px;
  font-weight: 700;
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: 4px;
  margin-bottom: 25px;
}

.celeb-name-large {
  font-size: 65px;
  font-weight: 750;
  color: #fff;
  letter-spacing: -1.5px;
  margin-bottom: 20px;
  line-height: 1.1;
}

.celeb-age-badge {
  display: inline-block;
  background: rgba(217,170,96,.12);
  border: 1px solid rgba(217,170,96,.4);
  color: var(--gold-light);
  font-size: 16px;
  font-weight: 700;
  padding: 10px 24px;
  border-radius: 30px;
  margin-bottom: 22px;
}

.celeb-wish-text {
  font-size: 23px;
  color: #c3ccda;
  font-weight: 400;
  line-height: 1.5;
}

@keyframes bounceIn {
  0% {
    opacity: 0;
    transform: translateY(20px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

/* SMALLER SCREENS */

@media (max-height: 800px) {
  .screen-wrapper {
    padding: 22px 35px 18px;
  }

  .header-group {
    padding-bottom: 15px;
  }

  .title-box h1 {
    font-size: 29px;
  }

  .main-content {
    padding-top: 10px;
  }

  .node-circle {
    width: 43px;
    height: 43px;
    font-size: 14px;
  }

  .path-node {
    gap: 5px;
  }

  .node-title {
    font-size: 11px;
  }

  .node-sub {
    font-size: 9px;
    margin-top: 2px;
  }
}

</style>
</head>

<body>

<div class="bg-glow"></div>

<div class="test-banner" id="testBanner">
  Test Mode Actief
</div>

<canvas id="confettiCanvas"></canvas>

<div class="screen-wrapper">

  <div class="header-group">
    <div class="title-box">
      <h1 id="mainTitle">Verjaardagen deze maand</h1>
      <p id="subTitle">Team Overzicht</p>
    </div>

    <div class="date-display" id="dateDisplay">--</div>
  </div>

  <div class="main-content" id="contentArea"></div>

</div>

<script>

/* BIRTHDAY DATA */

const birthdays = [
  { name:"Laila van Oversteeg", dob:"2005-01-19", month:1, day:19 },
  { name:"Malgorzata Witczak", dob:"1994-02-09", month:2, day:9 },
  { name:"Wendy Slag", dob:"1979-02-13", month:2, day:13 },
  { name:"Robert Markvoort", dob:"1972-02-22", month:2, day:22 },
  { name:"Sander Bremer", dob:"1975-03-05", month:3, day:5 },
  { name:"Arjan Dijkstra", dob:"1974-03-16", month:3, day:16 },
  { name:"Anja Hoevink-Zwijnenberg", dob:"1970-03-25", month:3, day:25 },
  { name:"Florus van den Berge", dob:"1979-04-02", month:4, day:2 },
  { name:"Remco Grondhuis", dob:"1988-04-10", month:4, day:10 },
  { name:"Christoph Ahlers", dob:"1967-04-19", month:4, day:19 },
  { name:"Lieke van Horssen", dob:"2000-04-23", month:4, day:23 },
  { name:"Pim van Oppen", dob:"1973-05-04", month:5, day:4 },
  { name:"Jeroen Schuitemaker", dob:"1991-05-09", month:5, day:9 },
  { name:"Manfred Zeides", dob:"1965-05-12", month:5, day:12 },
  { name:"Martijn Steunenberg", dob:"1975-05-14", month:5, day:14 },
  { name:"Laurents ten Voorde", dob:"1962-05-15", month:5, day:15 },
  { name:"Antoinette Geels", dob:"1968-05-25", month:5, day:25 },
  { name:"Levan Hendriks", dob:"2007-06-07", month:6, day:7 },
  { name:"Maud Meilink", dob:"2006-06-17", month:6, day:17 },
  { name:"Linda Drost", dob:"1987-06-18", month:6, day:18 },
  { name:"Tico van der Linde", dob:"1984-06-19", month:6, day:19 },
  { name:"Gerald Wijnen", dob:"1970-06-19", month:6, day:19 },
  { name:"Ansjelo Gerritsen", dob:"1998-07-01", month:7, day:1 },
  { name:"Marwan hersi", dob:"1986-07-08", month:7, day:8 },
  { name:"Edwin Hüsing", dob:"1966-07-29", month:7, day:29 },
  { name:"Kevin Keizer", dob:"1995-08-03", month:8, day:3 },
  { name:"Iné van Dijk", dob:"2004-08-06", month:8, day:6 },
  { name:"Peter Karssies", dob:"1964-09-06", month:9, day:6 },
  { name:"Gerwin Meilink", dob:"1973-09-09", month:9, day:9 },
  { name:"Raymond van Dijk", dob:"1976-09-24", month:9, day:24 },
  { name:"Kevin van Elven", dob:"1998-10-10", month:10, day:10 },
  { name:"Tim Zwiers", dob:"1998-10-11", month:10, day:11 },
  { name:"Stefan Boekhorst", dob:"1973-10-16", month:10, day:16 },
  { name:"Gilbert Rada", dob:"1973-11-12", month:11, day:12 },
  { name:"Desiree Wissink", dob:"1969-11-12", month:11, day:12 },
  { name:"Marco Vooijs", dob:"1991-11-30", month:11, day:30 },
  { name:"Roy Kienhuis", dob:"1993-12-24", month:12, day:24 },
  { name:"Fenny Voortman - Lohuis", dob:"1966-12-30", month:12, day:30 },
  { name:"Ilona Pigge - Maatje", dob:"1981-12-31", month:12, day:31 }
];

const dutchMonths = [
  "januari","februari","maart","april","mei","juni",
  "juli","augustus","september","oktober","november","december"
];

function splitName(fullName) {
  const parts = fullName.trim().split(" ");
  if (parts.length === 1) return { first:parts[0], last:"" };
  const last = parts.pop();
  return { first:parts.join(" "), last };
}

function calculateAge(dob,year) {
  return year - Number(dob.substring(0,4));
}

function getDaysInMonth(year,month) {
  return new Date(year,month,0).getDate();
}

/* STRAIGHT CONNECTING ROUTE */

function drawSnakeRoute() {

  const grid = document.getElementById("snakeContainer");
  const svg = document.getElementById("snakeRoute");

  if (!grid || !svg) return;

  const bounds = grid.getBoundingClientRect();

  svg.setAttribute(
    "viewBox",
    `0 0 ${bounds.width} ${bounds.height}`
  );

  const circles = [...grid.querySelectorAll(".node-circle")];

  const points = circles.map(circle => {
    const r = circle.getBoundingClientRect();

    return {
      x:r.left + r.width/2 - bounds.left,
      y:r.top + r.height/2 - bounds.top
    };
  });

  const pointString = points
    .map(p => `${p.x},${p.y}`)
    .join(" ");

  ["routeShadow","routeLine","routeHighlight"].forEach(id => {
    const path = document.getElementById(id);

    if (path) {
      path.setAttribute("points",pointString);
    }
  });
}

/* CONFETTI */

function triggerConfetti() {

  const canvas = document.getElementById("confettiCanvas");
  const ctx = canvas.getContext("2d");

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  let particles = [];

  const colors = [
    "#d9aa60",
    "#f1d29b",
    "#3b82b9",
    "#647da8",
    "#a9b8ce"
  ];

  for (let i=0;i<90;i++) {
    particles.push({
      x:canvas.width/2+(Math.random()-.5)*250,
      y:canvas.height/2,
      vx:(Math.random()-.5)*12,
      vy:Math.random()*-14-4,
      size:Math.random()*7+3,
      color:colors[Math.floor(Math.random()*colors.length)],
      rotation:Math.random()*360,
      rotSpeed:(Math.random()-.5)*10,
      gravity:.35,
      opacity:1
    });
  }

  function update() {

    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach(p => {
      p.x+=p.vx;
      p.y+=p.vy;
      p.vy+=p.gravity;
      p.rotation+=p.rotSpeed;
      p.opacity-=.008;

      if (p.opacity>0) {
        ctx.save();
        ctx.translate(p.x,p.y);
        ctx.rotate(p.rotation*Math.PI/180);
        ctx.globalAlpha=p.opacity;
        ctx.fillStyle=p.color;
        ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.6);
        ctx.restore();
      }
    });

    if (particles.some(p=>p.opacity>0)) {
      requestAnimationFrame(update);
    }
  }

  update();
}

/* TODAY'S BIRTHDAY */

function renderCelebration(persons,year) {

  const contentArea = document.getElementById("contentArea");

  document.getElementById("mainTitle").innerText = "Jarig Vandaag";
  document.getElementById("subTitle").innerText = "";

  let html = "";

  persons.forEach(person => {

    const {first,last} = splitName(person.name);
    const age = calculateAge(person.dob,year);

    html += `
      <div class="celebration-feature">

        <div class="celeb-tag">
          Vandaag in de spotlight
        </div>

        <div class="celeb-name-large">
          ${first}
          <span style="color:#d9aa60;display:block;font-size:44px;margin-top:5px;">
            ${last}
          </span>
        </div>

        <div class="celeb-age-badge">
          Wordt ${age} jaar
        </div>

        <div class="celeb-wish-text">
          Van harte gefeliciteerd met je verjaardag!
        </div>

      </div>
    `;
  });

  contentArea.innerHTML = html;

  setTimeout(triggerConfetti,200);
}

/* MAIN RENDER */

function renderPage() {

  const params = new URLSearchParams(window.location.search);
  const isTestMode = params.get("test")==="true";

  if (isTestMode) {
    document.getElementById("testBanner").style.display = "block";
  }

  const now = new Date();
  const currentYear = now.getFullYear();

  const currentDay = isTestMode
    ? Number(params.get("day") || 12)
    : now.getDate();

  const currentMonth = isTestMode
    ? Number(params.get("month") || 11)
    : now.getMonth()+1;

  document.getElementById("dateDisplay").innerText =
    now.toLocaleDateString("nl-NL",{
      weekday:"long",
      day:"numeric",
      month:"long"
    });

  const todaysBirthdays = birthdays.filter(b =>
    b.month===currentMonth && b.day===currentDay
  );

  if (todaysBirthdays.length>0) {
    renderCelebration(todaysBirthdays,currentYear);
    return;
  }

  document.getElementById("mainTitle").innerText =
    "Verjaardagen deze maand";

  document.getElementById("subTitle").innerText =
    dutchMonths[currentMonth-1].toUpperCase();

  const monthlyBirthdays = birthdays.filter(b =>
    b.month===currentMonth
  );

  const totalDays = getDaysInMonth(currentYear,currentMonth);

  const birthdayMap = {};

  monthlyBirthdays.forEach(b => {
    if (!birthdayMap[b.day]) birthdayMap[b.day] = [];
    birthdayMap[b.day].push(b);
  });

  let pathHtml = `
    <div class="snake-grid" id="snakeContainer">

      <svg class="snake-route" id="snakeRoute">
        <polyline class="route-shadow" id="routeShadow"></polyline>
        <polyline class="route-line" id="routeLine"></polyline>
        <polyline class="route-highlight" id="routeHighlight"></polyline>
      </svg>
  `;

  const itemsPerRow = 7;

  for (let day=1;day<=totalDays;day++) {

    const people = birthdayMap[day] || [];

    const isPast = day<currentDay;
    const isToday = day===currentDay;
    const hasBirthday = people.length>0;

    const row = Math.floor((day-1)/itemsPerRow);
    const position = (day-1)%itemsPerRow;

    const column = row%2===0
      ? position+1
      : itemsPerRow-position;

    const statusClass = [
      isPast ? "past" : "",
      isToday ? "today" : "",
      hasBirthday ? "birthday" : ""
    ].filter(Boolean).join(" ");

    let title = "";
    let sub = "";
    let label = day;

    if (hasBirthday) {

      title = people.map(p => splitName(p.name).first).join(" & ");

      sub = people.length===1
        ? `Wordt ${calculateAge(people[0].dob,currentYear)} jaar`
        : `${people.length} verjaardagen`;

    } else if (isToday) {
      title = "Vandaag";
      sub = " ";
    }

    pathHtml += `
      <div class="path-node ${statusClass}"
           style="grid-column:${column};grid-row:${row+1};">

        <div class="node-circle">
          ${label}

          ${hasBirthday
            ? '<span class="milestone-star">★</span>'
            : ''
          }
        </div>

        ${title ? `
          <div class="node-text">
            <span class="node-title">${title}</span>
            <span class="node-sub">${sub}</span>
          </div>
        ` : ""}

      </div>
    `;
  }

  pathHtml += `</div>`;

  document.getElementById("contentArea").innerHTML = pathHtml;

  requestAnimationFrame(() => {
    requestAnimationFrame(drawSnakeRoute);
  });
}

/* INITIALIZE */

renderPage();

window.addEventListener("resize",drawSnakeRoute);

setInterval(renderPage,60000);

</script>
</body>
</html>
