<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verjaardagen</title>

<style>
:root {
  --bg: #090e19;
  --navy: #152541;
  --blue: #315a88;
  --blue-light: #4b86b8;
  --gold: #d9aa60;
  --gold-light: #f1d29b;
  --text: #f1f3f7;
  --muted: #8995a9;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
    Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

body {
  background:
    radial-gradient(ellipse at 50% 45%, rgba(39,67,104,.28), transparent 65%),
    linear-gradient(135deg, #090e19, #0c1525);
}

/* AMBIENT BACKGROUND */

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .12;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.2'/%3E%3C/svg%3E");
  z-index: 1;
}

.bg-glow {
  position: fixed;
  width: 700px;
  height: 700px;
  border-radius: 50%;
  background: rgba(217,170,96,.035);
  filter: blur(110px);
  right: -300px;
  bottom: -350px;
  pointer-events: none;
}

#confettiCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 10;
  pointer-events: none;
}

/* SCREEN */

.screen-wrapper {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100vh;
  padding: 32px 48px 25px;
  display: flex;
  flex-direction: column;
}

/* HEADER */

.header-group {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 23px;
  border-bottom: 1px solid rgba(255,255,255,.10);
  flex-shrink: 0;
}

.title-box h1 {
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -.8px;
  color: #fff;
}

.title-box p {
  font-size: 11px;
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: 3px;
  font-weight: 600;
  margin-top: 7px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 15px;
}

.date-display {
  font-size: 15px;
  font-weight: 500;
  color: #9ca9bd;
  letter-spacing: .3px;
}

/* DISCREET HIDDEN CSV UPLOAD ICON IN CORNER */
.hidden-upload-icon {
  position: fixed;
  bottom: 15px;
  left: 20px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  overflow: hidden;
  cursor: pointer;
  opacity: 0.25;
  transition: opacity .3s ease, transform .3s ease;
  z-index: 100;
  border: 1px solid rgba(255,255,255,0.2);
}

.hidden-upload-icon:hover {
  opacity: 1;
  transform: scale(1.1);
}

.hidden-upload-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#csvFileInput {
  display: none;
}

/* DRAG OVERLAY */
.drag-overlay {
  position: fixed;
  inset: 0;
  background: rgba(9,14,25,0.9);
  border: 3px dashed var(--gold);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  color: var(--gold-light);
  font-weight: 700;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease;
}

.drag-overlay.active {
  opacity: 1;
}

/* MAIN CONTENT */

.main-content {
  flex: 1;
  min-height: 0;
  width: 100%;
  display: flex;
  align-items: stretch;
  justify-content: center;
  padding: 18px 0 8px;
  position: relative;
}

/* CALENDAR GRID */

.snake-grid {
  position: relative;
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  grid-template-rows: repeat(5, minmax(0, 1fr));
  column-gap: 8px;
  row-gap: 5px;
  padding: 4px 0;
  overflow: hidden;
}

/* CONNECTING ROUTE */

.snake-route {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: visible;
}

.route-shadow {
  fill: none;
  stroke: rgba(0,0,0,.4);
  stroke-width: 10;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.route-line {
  fill: none;
  stroke: #344966;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.route-highlight {
  fill: none;
  stroke: rgba(217,170,96,.5);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-dasharray: 3 35;
  animation: routeFlow 24s linear infinite;
}

@keyframes routeFlow {
  from { stroke-dashoffset: 0; }
  to { stroke-dashoffset: -760; }
}

/* DAY NODES */

.path-node {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 0;
  gap: 9px;
  text-align: center;
}

.orb-cluster {
  width: 53px;
  height: 53px;
  position: relative;
  flex-shrink: 0;
  overflow: visible;
  z-index: 2;
}

.node-circle {
  position: relative;
  z-index: 4;
  width: 53px;
  height: 53px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;

  background: linear-gradient(145deg, #1a2941, #111d30);
  border: 2px solid #34445d;

  box-shadow:
    0 5px 0 #080e19,
    0 8px 15px rgba(0,0,0,.3);

  color: #aab6c8;
  font-size: 16px;
  font-weight: 700;
  transition: all .3s ease;
}

/* COMPLETED DAYS */

.path-node.past .node-circle {
  background: linear-gradient(145deg, #315b8d, #203e66);
  border: 2px solid #416b9c;
  color: #e4edf8;

  box-shadow:
    0 5px 0 #142945,
    0 7px 13px rgba(0,0,0,.3);
}

/* TODAY */

.path-node.today .node-circle {
  background: linear-gradient(145deg, #4d91c0, #286b9d);
  border: 2px solid #a5d1ed;
  color: #fff;

  box-shadow:
    0 5px 0 #16466c,
    0 0 24px rgba(76,157,209,.25);

  transform: scale(1.12);
}

/* BIRTHDAY */

.path-node.birthday .node-circle {
  background: linear-gradient(145deg, #d9b477, #a97939);
  border: 2px solid #f0d3a0;
  color: #1c2330;

  box-shadow:
    0 5px 0 #644a2b,
    0 0 20px rgba(217,170,96,.17);

  animation: goldPulse 4s ease-in-out infinite;
}

.path-node.past.birthday .node-circle {
  background: linear-gradient(145deg, #315b8d, #203e66);
  border: 2px solid var(--gold);
  color: white;
}

.path-node.today.birthday .node-circle {
  background: linear-gradient(145deg, #e6bd79, #c18a43);
  border: 2px solid #fff0cf;
  color: #1c2330;
}

@keyframes goldPulse {
  0%,100% {
    box-shadow: 0 5px 0 #644a2b,
                0 0 12px rgba(217,170,96,.12);
  }
  50% {
    box-shadow: 0 5px 0 #644a2b,
                0 0 27px rgba(217,170,96,.38);
  }
}

/* SATELLITE ORBS & LINES */

.satellite-line {
  position: absolute;
  height: 1.5px;
  background: rgba(217,170,96,.65);
  transform-origin: left center;
  z-index: 1;
  pointer-events: none;
}

.satellite {
  position: absolute;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  z-index: 2;

  display: flex;
  align-items: center;
  justify-content: center;

  background: linear-gradient(145deg, #f1d29b, #c28c47);
  border: 1.5px solid #fff0cf;

  color: #263044;
  font-size: 10px;
  font-weight: 800;

  box-shadow:
    0 2px 5px rgba(0,0,0,.5),
    0 0 9px rgba(217,170,96,.2);

  animation: satelliteAppear .7s cubic-bezier(.2,.8,.3,1.2) both;
}

.path-node.past .satellite {
  background: linear-gradient(145deg, #6592bd, #315b8d);
  border-color: var(--gold-light);
  color: white;
}

/* SATELLITE LABEL */

.satellite-label {
  position: absolute;
  z-index: 6;
  display: flex;
  flex-direction: column;
  white-space: nowrap;
  pointer-events: none;
  animation: satelliteAppear .7s cubic-bezier(.2,.8,.3,1.2) both;
}

.satellite-label.align-right {
  text-align: left;
}

.satellite-label.align-left {
  text-align: right;
}

.sat-name {
  font-size: 11px;
  font-weight: 700;
  color: var(--gold-light);
  line-height: 1.15;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}

.sat-sub {
  font-size: 9px;
  font-weight: 500;
  color: #aab6c8;
  line-height: 1.15;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}

@keyframes satelliteAppear {
  from {
    opacity: 0;
    transform: scale(.1);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* NODE TEXT */

.node-text {
  width: 100%;
  max-width: 120%;
  padding: 0 2px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.node-title {
  font-size: 11px;
  font-weight: 650;
  color: #cbd4e1;
  line-height: 1.25;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.milestone-star {
  position: absolute;
  top: -8px;
  right: -9px;
  width: 19px;
  height: 19px;
  border-radius: 50%;
  background: var(--gold);
  border: 2px solid var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #263044;
  font-size: 10px;
  font-weight: 900;
  z-index: 5;
}

/* CELEBRATION SCREENS */

.celebration-screen {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 15px 20px;
  animation: celebrationEnter 1s ease both;
  position: relative;
}

.celebration-screen::before {
  content: "";
  position: absolute;
  top: 5%;
  left: 50%;
  transform: translateX(-50%);
  width: 170px;
  height: 2px;
  background: linear-gradient(90deg,transparent,var(--gold),transparent);
}

.celeb-heading {
  font-size: 42px;
  font-weight: 650;
  color: #fff;
  letter-spacing: -1px;
  margin-top: 10px;
  margin-bottom: 30px;
  text-align: center;
}

.celeb-people {
  display: flex;
  justify-content: center;
  align-items: stretch;
  gap: 30px;
  width: 100%;
  max-width: 1150px;
  flex-wrap: wrap;
}

/* STANDAARD VERJAARDAG KAART */
.celeb-person {
  position: relative;
  flex: 1;
  min-width: 260px;
  max-width: 480px;
  padding: 35px 30px 32px;
  text-align: center;
  background: linear-gradient(145deg, rgba(38,55,79,.75), rgba(15,25,42,.8));
  border: 1px solid rgba(217,170,96,.3);
  box-shadow: 0 15px 50px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.06);
  animation: cardEnter .8s ease both;
}

.celeb-person::before,
.celeb-person::after {
  content: "";
  position: absolute;
  width: 35px;
  height: 35px;
  border-color: rgba(217,170,96,.55);
  border-style: solid;
}
.celeb-person::before { top: 9px; left: 9px; border-width: 1px 0 0 1px; }
.celeb-person::after { bottom: 9px; right: 9px; border-width: 0 1px 1px 0; }

.celeb-number {
  font-size: 12px;
  color: var(--gold);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 20px;
}

.celeb-name {
  font-size: clamp(30px, 3vw, 46px);
  font-weight: 750;
  color: #fff;
  letter-spacing: -1px;
  line-height: 1.15;
  margin-bottom: 20px;
}

.celeb-age {
  display: inline-block;
  padding: 9px 24px;
  border: 1px solid rgba(217,170,96,.45);
  background: rgba(217,170,96,.1);
  color: var(--gold-light);
  font-size: 14px;
  font-weight: 650;
  letter-spacing: .5px;
}

/* SPECIAAL MIJLPAAL / LUXE VERJAARDAG KAART */
.special-card {
  position: relative;
  flex: 1;
  min-width: 280px;
  max-width: 520px;
  padding: 45px 35px 40px;
  text-align: center;
  background: linear-gradient(155deg, rgba(45,35,20,0.85), rgba(15,18,26,0.95));
  border: 2px solid var(--gold);
  box-shadow: 0 20px 60px rgba(217,170,96,0.2), inset 0 0 30px rgba(217,170,96,0.08);
  animation: cardEnter .8s ease both;
}

.special-badge {
  font-size: 11px;
  color: #fff0cf;
  letter-spacing: 4px;
  text-transform: uppercase;
  background: rgba(217,170,96,0.2);
  border: 1px solid var(--gold);
  padding: 6px 16px;
  border-radius: 20px;
  display: inline-block;
  margin-bottom: 22px;
}

.special-name {
  font-size: clamp(32px, 3.2vw, 48px);
  font-weight: 800;
  color: #fff;
  letter-spacing: -1px;
  line-height: 1.15;
  margin-bottom: 18px;
  background: linear-gradient(to bottom, #fff, var(--gold-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.special-age {
  font-size: 18px;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: 1px;
  margin-bottom: 25px;
}

.special-star-icon {
  font-size: 20px;
  color: var(--gold);
  margin-bottom: 20px;
}

.celeb-wish {
  color: #c3ccda;
  font-size: 18px;
  margin-top: 35px;
  text-align: center;
  letter-spacing: .2px;
}

@keyframes celebrationEnter {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes cardEnter {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>

<body>

<div class="bg-glow"></div>
<canvas id="confettiCanvas"></canvas>
<div class="drag-overlay" id="dragOverlay">Sleep CSV-bestand hiernaartoe om te uploaden</div>

<!-- DISCREET IPEX ICON IN CORNER FOR CSV UPLOAD -->
<div class="hidden-upload-icon" title="CSV Uploaden" onclick="document.getElementById('csvFileInput').click()">
  <img src="data:image/svg+xml;utf8,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='100' cy='100' r='100' fill='%23152541'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='bold' font-size='60' fill='%23d9aa60'%3E
