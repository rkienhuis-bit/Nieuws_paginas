<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Verjaardagen Pad</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0b0f19;
      color: #ffffff;
    }

    .bg-gradient {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 30%, rgba(245, 158, 11, 0.07) 0%, rgba(11, 15, 25, 1) 80%);
      z-index: 1;
      pointer-events: none;
    }
    #confettiCanvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    .screen-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100vh;
      padding: 40px 60px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .header-group {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 20px;
    }

    .title-box h1 {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .title-box p {
      font-size: 12px;
      color: #f59e0b;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
    }

    .date-display {
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
    }

    .test-banner {
      position: fixed;
      top: 15px; left: 50%; transform: translateX(-50%);
      background: #f59e0b; color: #000;
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
      padding: 4px 12px; border-radius: 4px; z-index: 999;
      display: none;
    }

    .main-content {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 0;
      overflow: hidden;
    }

    /* DUOLINGO-STYLE PATH MAP CONTAINER */
    .path-map-container {
      width: 100%;
      max-width: 1000px;
      height: 100%;
      max-height: 720px;
      overflow-y: auto;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      position: relative;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(245, 158, 11, 0.2); border-radius: 4px; }

    /* ROW FOR ZIG-ZAG PATH */
    .path-row {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      gap: 40px;
    }

    .path-row.left { justify-content: flex-start; padding-left: 15%; }
    .path-row.center { justify-content: center; }
    .path-row.right { justify-content: flex-end; padding-right: 15%; }

    /* ORB / NODE STYLES */
    .node-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      width: 320px;
      transition: all 0.3s ease;
    }

    /* PAST NODES */
    .node-item.past {
      opacity: 0.4;
      border-color: rgba(255, 255, 255, 0.03);
    }
    .node-item.past .node-orb {
      background: rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      border-color: rgba(255, 255, 255, 0.15);
    }

    /* TODAY NODE */
    .node-item.today {
      background: rgba(56, 189, 248, 0.06);
      border-color: rgba(56, 189, 248, 0.4);
    }
    .node-item.today .node-orb {
      background: #38bdf8;
      color: #0b0f19;
      border-color: #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
    }

    /* BIRTHDAY NODE */
    .node-item.birthday {
      background: rgba(245, 158, 11, 0.08);
      border-color: rgba(245, 158, 11, 0.5);
      box-shadow: 0 10px 30px rgba(245, 158, 11, 0.15);
    }
    .node-item.birthday .node-orb {
      background: #f59e0b;
      color: #0b0f19;
      border-color: #f59e0b;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.7);
      animation: pulseOrb 2s infinite alternate;
    }

    @keyframes pulseOrb {
      0% { transform: scale(1); box-shadow: 0 0 15px rgba(245, 158, 11, 0.5); }
      100% { transform: scale(1.08); box-shadow: 0 0 30px rgba(245, 158, 11, 0.8); }
    }

    .node-orb {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      color: #94a3b8;
      flex-shrink: 0;
    }

    .node-content {
      display: flex;
      flex-direction: column;
    }

    .node-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }

    .node-sub {
      font-size: 12px;
      font-weight: 500;
      color: #94a3b8;
      margin-top: 2px;
    }

    .node-item.birthday .node-title {
      color: #f59e0b;
    }

    /* TODAY CELEBRATION FEATURE VIEW */
    .celebration-feature {
      width: 100%;
      max-width: 650px;
      text-align: center;
      padding: 60px 40px;
      background: radial-gradient(circle at 50% 30%, rgba(245, 158, 11, 0.12) 0%, rgba(15, 23, 42, 0) 70%);
      position: relative;
      animation: bounceIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .celebration-feature::before {
      content: '';
      position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 120px; height: 3px;
      background: linear-gradient(90deg, transparent, #f59e0b, transparent);
      border-radius: 2px;
    }

    .celeb-tag {
      font-size: 13px;
      font-weight: 700;
      color: #f59e0b;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 20px;
    }

    .celeb-name-large {
      font-size: 60px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -1px;
      margin-bottom: 14px;
      line-height: 1.1;
    }

    .celeb-age-badge {
      display: inline-block;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #f59e0b;
      font-size: 15px;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .celeb-wish-text {
      font-size: 22px;
      color: #f3f4f6;
      font-weight: 500;
      line-height: 1.5;
    }

    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0.9) translateY(20px); }
      60% { opacity: 1; transform: scale(1.02) translateY(-5px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
  </style>
</head>
<body>

  <div class="test-banner" id="testBanner">Test Mode Actief (?test=true)</div>
  <div class="bg-gradient"></div>
  <canvas id="confettiCanvas"></canvas>

  <div class="screen-wrapper">
    <!-- HEADER -->
    <div class="header-group">
      <div class="title-box">
        <h1 id="mainTitle">Verjaardagen deze maand</h1>
        <p id="subTitle">Team Overzicht</p>
      </div>
      <div class="date-display" id="dateDisplay">--</div>
    </div>

    <!-- CONTENT -->
    <div class="main-content" id="contentArea"></div>
  </div>

  <script>
    const birthdays = [
      { name: "Laila van Oversteeg", dob: "2005-01-19", month: 1, day: 19 },
      { name: "Malgorzata Witczak", dob: "1994-02-09", month: 2, day: 9 },
      { name: "Wendy Slag", dob: "1979-02-13", month: 2, day: 13 },
      { name: "Robert Markvoort", dob: "1972-02-22", month: 2, day: 22 },
      { name: "Sander Bremer", dob: "1975-03-05", month: 3, day: 5 },
      { name: "Arjan Dijkstra", dob: "1974-03-16", month: 3, day: 16 },
      { name: "Anja Hoevink-Zwijnenberg", dob: "1970-03-25", month: 3, day: 25 },
      { name: "Florus van den Berge", dob: "1979-04-02", month: 4, day: 2 },
      { name: "Remco Grondhuis", dob: "1988-04-10", month: 4, day: 10 },
      { name: "Christoph Ahlers", dob: "1967-04-19", month: 4, day: 19 },
      { name: "Lieke van Horssen", dob: "2000-04-23", month: 4, day: 23 },
      { name: "Pim van Oppen", dob: "1973-05-04", month: 5, day: 4 },
      { name: "Jeroen Schuitemaker", dob: "1991-05-09", month: 5, day: 9 },
      { name: "Manfred Zeides", dob: "1965-05-12", month: 5, day: 12 },
      { name: "Martijn Steunenberg", dob: "1975-05-14", month: 5, day: 14 },
      { name: "Laurents ten Voorde", dob: "1962-05-15", month: 5, day: 15 },
      { name: "Antoinette Geels", dob: "1968-05-25", month: 5, day: 25 },
      { name: "Levan Hendriks", dob: "2007-06-07", month: 6, day: 7 },
      { name: "Maud Meilink", dob: "2006-06-17", month: 6, day: 17 },
      { name: "Linda Drost", dob: "1987-06-18", month: 6, day: 18 },
      { name: "Tico van der Linde", dob: "1984-06-19", month: 6, day: 19 },
      { name: "Gerald Wijnen", dob: "1970-06-19", month: 6, day: 19 },
      { name: "Ansjelo Gerritsen", dob: "1998-07-01", month: 7, day: 1 },
      { name: "Marwan hersi", dob: "1986-07-08", month: 7, day: 8 },
      { name: "Edwin Hüsing", dob: "1966-07-29", month: 7, day: 29 },
      { name: "Kevin Keizer", dob: "1995-08-03", month: 8, day: 3 },
      { name: "Iné van Dijk", dob: "2004-08-06", month: 8, day: 6 },
      { name: "Peter Karssies", dob: "1964-09-06", month: 9, day: 6 },
      { name: "Gerwin Meilink", dob: "1973-09-09", month: 9, day: 9 },
      { name: "Raymond van Dijk", dob: "1976-09-24", month: 9, day: 24 },
      { name: "Kevin van Elven", dob: "1998-10-10", month: 10, day: 10 },
      { name: "Tim Zwiers", dob: "1998-10-11", month: 10, day: 11 },
      { name: "Stefan Boekhorst", dob: "1973-10-16", month: 10, day: 16 },
      { name: "Gilbert Rada", dob: "1973-11-12", month: 11, day: 12 },
      { name: "Desiree Wissink", dob: "1969-11-12", month: 11, day: 12 },
      { name: "Marco Vooijs", dob: "1991-11-30", month: 11, day: 30 },
      { name: "Roy Kienhuis", dob: "1993-12-24", month: 12, day: 24 },
      { name: "Fenny Voortman - Lohuis", dob: "1966-12-30", month: 12, day: 30 },
      { name: "Ilona Pigge - Maatje", dob: "1981-12-31", month: 12, day: 31 }
    ];

    const dutchMonths = [
      "januari", "februari", "maart", "april", "mei", "juni", 
      "juli", "augustus", "september", "oktober", "november", "december"
    ];

    function splitName(fullName) {
      const parts = fullName.trim().split(' ');
      if (parts.length === 1) return { first: parts[0], last: '' };
      const last = parts.pop();
      const first = parts.join(' ');
      return { first, last };
    }

    function calculateAge(dobString, currentYear) {
      const birthYear = new Date(dobString).getFullYear();
      return currentYear - birthYear;
    }

    function getDaysInMonth(year, month) {
      return new Date(year, month, 0).getDate();
    }

    function triggerConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let particles = [];
      const colors = ['#f59e0b', '#38bdf8', '#f43f5e', '#a855f7', '#10b981'];

      for (let i = 0; i < 70; i++) {
        particles.push({
          x: canvas.width / 2 + (Math.random() - 0.5) * 200,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 12,
          vy: Math.random() * -14 - 4,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 10,
          gravity: 0.35,
          opacity: 1
        });
      }

      function update() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.rotation += p.rotSpeed;
          p.opacity -= 0.008;

          if (p.opacity > 0) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.globalAlpha = p.opacity;
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
            ctx.restore();
          }
        });

        if (particles.some(p => p.opacity > 0)) {
          requestAnimationFrame(update);
        }
      }
      update();
    }

    function renderPage() {
      const urlParams = new URLSearchParams(window.location.search);
      const isTestMode = urlParams.get('test') === 'true';

      if (isTestMode) {
        document.getElementById('testBanner').style.display = 'block';
      }

      const now = new Date();
      const currentYear = now.getFullYear();
      const currentDay = isTestMode ? 12 : now.getDate();
      const currentMonth = isTestMode ? 11 : now.getMonth() + 1;

      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('dateDisplay').innerText = now.toLocaleDateString('nl-NL', options);

      const todaysBirthdays = birthdays.filter(b => b.month === currentMonth && b.day === currentDay);
      const contentArea = document.getElementById('contentArea');

      if (todaysBirthdays.length > 0) {
        document.getElementById('mainTitle').innerText = "Jarig Vandaag";
        document.getElementById('subTitle').innerText = "";

        let html = '';
        todaysBirthdays.forEach(person => {
          const { first, last } = splitName(person.name);
          const age = calculateAge(person.dob, currentYear);
          html += `
            <div class="celebration-feature">
              <div class="celeb-tag">Vandaag in de spotlight</div>
              <div class="celeb-name-large">${first} <span style="color:#f59e0b; display:block; font-size:42px; margin-top:4px;">${last}</span></div>
              <div class="celeb-age-badge">Wordt ${age} jaar</div>
              <div class="celeb-wish-text">Van harte gefeliciteerd met je verjaardag!</div>
            </div>
          `;
        });
        contentArea.innerHTML = html;
        setTimeout(triggerConfetti, 200);
      } else {
        document.getElementById('mainTitle').innerText = "Verjaardagen deze maand";
        document.getElementById('subTitle').innerText = dutchMonths[currentMonth - 1].toUpperCase();

        const monthlyBirthdays = birthdays.filter(b => b.month === currentMonth);
        const totalDays = getDaysInMonth(currentYear, currentMonth);

        // Map birthdays by day for quick lookup
        const birthdayMap = {};
        monthlyBirthdays.forEach(b => {
          if (!birthdayMap[b.day]) birthdayMap[b.day] = [];
          birthdayMap[b.day].push(b);
        });

        let pathHtml = `<div class="path-map-container">`;
        
        // Build path nodes for every day of the month or milestone days
        for (let day = 1; day <= totalDays; day++) {
          const hasBday = birthdayMap[day];
          const isPast = day < currentDay;
          const isToday = day === currentDay;
          const alignClass = day % 3 === 1 ? 'left' : (day % 3 === 2 ? 'center' : 'right');

          if (hasBday) {
            hasBday.forEach(person => {
              const { first, last } = splitName(person.name);
              const age = calculateAge(person.dob, currentYear);
              pathHtml += `
                <div class="path-row ${alignClass}">
                  <div class="node-item birthday">
                    <div class="node-orb">🎈</div>
                    <div class="node-content">
                      <span class="node-title">${first} ${last}</span>
                      <span class="node-sub">${day} ${dutchMonths[currentMonth - 1]} • Wordt ${age}</span>
                    </div>
                  </div>
                </div>
              `;
            });
          } else {
            // Optional: show subtle node or skip non-birthday days to keep it clean. Let's show notable or all days if desired, but for narrowcasting showing days with birthdays + today keeps it punchy. Let's show today's node if no birthday!
            if (isToday) {
              pathHtml += `
                <div class="path-row ${alignClass}">
                  <div class="node-item today">
                    <div class="node-orb">${day}</div>
                    <div class="node-content">
                      <span class="node-title" style="color:#38bdf8;">Vandaag</span>
                      <span class="node-sub">${day} ${dutchMonths[currentMonth - 1]}</span>
                    </div>
                  </div>
                </div>
              `;
            }
          }
        }
        pathHtml += `</div>`;
        contentArea.innerHTML = pathHtml;
      }
    }

    renderPage();
    setInterval(renderPage, 60 * 1000);
  </script>
</body>
</html>
