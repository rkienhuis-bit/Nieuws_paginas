
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPEX Group | Verjaardagen</title>

<style>
:root {
  --navy: #182b50;
  --blue: #647da8;
  --blue-light: #e9eef6;
  --green: #dcefe5;
  --green-dark: #6b9b80;
  --purple: #9699c1;
  --purple-light: #ededf5;
  --white: #ffffff;
  --background: #f5f6f8;
  --grey: #c9cdd4;
  --text: #263752;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--background);
  color: var(--navy);
}

.screen {
  height: 100vh;
  width: 100vw;
  padding: 42px 65px 35px;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* BACKGROUND */

.background-shape {
  position: absolute;
  width: 650px;
  height: 650px;
  border-radius: 50%;
  background: var(--green);
  opacity: .35;
  right: -350px;
  bottom: -370px;
  z-index: 0;
}

.background-shape.two {
  width: 350px;
  height: 350px;
  right: auto;
  left: -240px;
  bottom: 180px;
  background: var(--purple-light);
  opacity: .7;
}

/* HEADER */

.header {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 24px;
  border-bottom: 2px solid #e3e6eb;
}

.brand {
  display: flex;
  align-items: center;
  gap: 15px;
}

.brand-mark {
  width: 52px;
  height: 52px;
  background: var(--navy);
  border-radius: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 23px;
  font-weight: 900;
  letter-spacing: -2px;
  box-shadow: 0 4px 0 #0e1d38;
}

.brand-name {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 2px;
  color: var(--navy);
}

.brand-sub {
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--blue);
  margin-top: 4px;
  font-weight: 700;
}

.header-right {
  text-align: right;
}

.header-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 3px;
  color: var(--blue);
  font-weight: 700;
}

.header-date {
  font-size: 19px;
  font-weight: 700;
  margin-top: 5px;
}

/* INTRO */

.intro {
  position: relative;
  z-index: 2;
  margin: 28px 0 22px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}

.intro h1 {
  font-size: 35px;
  font-weight: 800;
  letter-spacing: -1px;
}

.intro p {
  font-size: 15px;
  color: #78859a;
  margin-top: 7px;
}

.month-tag {
  background: var(--purple-light);
  color: var(--navy);
  border-radius: 30px;
  padding: 11px 23px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 1px;
}

/* BIRTHDAY PATH */

.path-area {
  flex: 1;
  min-height: 0;
  position: relative;
  z-index: 2;
  padding: 12px 5px;
}

.path-grid {
  position: relative;
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  grid-template-rows: repeat(5, minmax(0, 1fr));
  column-gap: 15px;
  row-gap: 9px;
}

.path-line {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  z-index: 0;
  pointer-events: none;
}

.path-line path {
  fill: none;
  stroke: #d9e0e9;
  stroke-width: 7;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 1 1;
}

/* DAY NODES */

.day {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  min-width: 0;
}

.day-circle {
  width: 59px;
  height: 59px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  border: 3px solid #dfe3e9;
  box-shadow: 0 5px 0 #cbd0d7;
  font-size: 19px;
  font-weight: 800;
  color: #8994a4;
  flex-shrink: 0;
  position: relative;
  transition: transform .3s;
}

.day.past .day-circle {
  background: #e9ebee;
  border-color: #e9ebee;
  box-shadow: 0 4px 0 #d3d6da;
  color: #aab0b8;
}

.day.today .day-circle {
  background: var(--blue);
  color: white;
  border-color: var(--blue);
  box-shadow: 0 5px 0 #435d86;
  transform: scale(1.12);
}

.day.birthday .day-circle {
  background: var(--green);
  color: var(--navy);
  border: 4px solid var(--green-dark);
  box-shadow: 0 5px 0 #91b5a0;
  transform: scale(1.12);
}

.day.birthday.today .day-circle {
  background: var(--navy);
  border-color: var(--navy);
  color: white;
  box-shadow: 0 5px 0 #0e1d38;
}

.day-number {
  position: absolute;
  top: -8px;
  right: -8px;
  background: var(--purple);
  color: white;
  border: 2px solid white;
  width: 23px;
  height: 23px;
  border-radius: 50%;
  font-size: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
}

.day-info {
  text-align: center;
  margin-top: 10px;
  max-width: 100%;
}

.day-name {
  font-size: 13px;
  font-weight: 800;
  color: var(--navy);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.day-age {
  font-size: 11px;
  color: #8190a5;
  margin-top: 3px;
}

.day.birthday .day-age {
  color: var(--green-dark);
  font-weight: 700;
}

.day.today .day-name {
  color: var(--blue);
}

/* TODAY CELEBRATION */

.celebration {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 2;
  text-align: center;
}

.celebration-inner {
  width: 100%;
  max-width: 1000px;
  animation: appear .9s ease-out;
}

.celebration-symbol {
  width: 115px;
  height: 115px;
  margin: 0 auto 25px;
  border-radius: 50%;
  background: var(--green);
  border: 6px solid var(--green-dark);
  box-shadow: 0 9px 0 #b6d4c1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 54px;
}

.celebration-label {
  font-size: 14px;
  font-weight: 800;
  color: var(--green-dark);
  text-transform: uppercase;
  letter-spacing: 4px;
  margin-bottom: 18px;
}

.celebration h1 {
  font-size: 65px;
  line-height: 1.1;
  letter-spacing: -2px;
  font-weight: 900;
  color: var(--navy);
}

.celebration-age {
  display: inline-block;
  margin-top: 22px;
  padding: 12px 28px;
  background: var(--purple-light);
  color: var(--navy);
  border-radius: 30px;
  font-weight: 800;
  font-size: 18px;
}

.celebration-message {
  font-size: 23px;
  color: #6d7c91;
  margin-top: 28px;
}

.celebration-bottom {
  font-size: 13px;
  color: var(--blue);
  letter-spacing: 3px;
  font-weight: 800;
  margin-top: 48px;
}

/* FOOTER */

.footer {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 2px solid #e3e6eb;
  padding-top: 17px;
  margin-top: 15px;
  color: #8994a4;
  font-size: 11px;
  letter-spacing: 1px;
}

.footer strong {
  color: var(--navy);
}

.footer-mark {
  display: flex;
  align-items: center;
  gap: 6px;
}

.footer-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green-dark);
}

/* ANIMATIONS */

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(25px) scale(.97);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.confetti {
  position: fixed;
  top: -20px;
  z-index: 10;
  width: 9px;
  height: 15px;
  animation: fall linear forwards;
  pointer-events: none;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
    opacity: 0;
  }
}

.test-banner {
  display: none;
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--navy);
  color: white;
  padding: 7px 18px;
  border-radius: 20px;
  font-size: 11px;
  z-index: 20;
  font-weight: 700;
}

/* RESPONSIVE */

@media (max-height: 800px) {
  .screen {
    padding: 25px 45px 20px;
  }

  .intro {
    margin: 17px 0 12px;
  }

  .day-circle {
    width: 48px;
    height: 48px;
    font-size: 16px;
  }

  .day-info {
    margin-top: 7px;
  }

  .day-name {
    font-size: 11px;
  }

  .day-age {
    font-size: 10px;
  }
}
</style>
</head>

<body>

<div class="background-shape"></div>
<div class="background-shape two"></div>
<div class="test-banner" id="testBanner">TESTMODUS ACTIEF</div>

<div class="screen">

  <header class="header">
    <div class="brand">
      <div class="brand-mark">I</div>
      <div>
        <div class="brand-name">IPEX GROUP</div>
        <div class="brand-sub">BUILDING CONNECTIONS</div>
      </div>
    </div>

    <div class="header-right">
      <div class="header-label">Samen bouwen, samen vieren</div>
      <div class="header-date" id="dateDisplay"></div>
    </div>
  </header>

  <section class="intro" id="intro">
    <div>
      <h1>Verjaardagen</h1>
      <p>Een mooie mijlpaal voor onze collega's.</p>
    </div>
    <div class="month-tag" id="monthTag"></div>
  </section>

  <main class="path-area" id="pathArea">
    <div class="path-grid" id="pathGrid">
      <svg class="path-line" id="pathLine">
        <path id="pathDrawing"></path>
      </svg>
    </div>
  </main>

  <footer class="footer">
    <div>IPEX GROUP <strong>•</strong> TEAM ENTER</div>
    <div class="footer-mark">
      <div class="footer-dot"></div>
      Samen maken we het verschil
    </div>
  </footer>

</div>

<script>

/* =================================
   VERJAARDAGEN
================================= */

const birthdays = [
  { name: "Laila van Oversteeg", dob: "2005-01-19", month: 1, day: 19 },
  { name: "Malgorzata Witczak", dob: "1994-02-09", month: 2, day: 9 },
  { name: "Wendy Slag", dob: "1979-02-13", month: 2, day: 13 },
  { name: "Robert Markvoort", dob: "1972-02-22", month: 2, day: 22 },
  { name: "Sander Bremer", dob: "1975-03-05", month: 3, day: 5 },
  { name: "Arjan Dijkstra", dob: "1974-03-16", month: 3, day: 16 },
  { name: "Anja Hoevink-Zwijnenberg", dob: "1970-03-25", month: 3, day: 25 },
  { name: "Florus van den Berge", dob: "1979-04-02", month: 4, day: 2 },
  { name: "Remco Grondhuis", dob: "1988-04-10", month: 4, day: 10 },
  { name: "Christoph Ahlers", dob: "1967-04-19", month: 4, day: 19 },
  { name: "Lieke van Horssen", dob: "2000-04-23", month: 4, day: 23 },
  { name: "Pim van Oppen", dob: "1973-05-04", month: 5, day: 4 },
  { name: "Jeroen Schuitemaker", dob: "1991-05-09", month: 5, day: 9 },
  { name: "Manfred Zeides", dob: "1965-05-12", month: 5, day: 12 },
  { name: "Martijn Steunenberg", dob: "1975-05-14", month: 5, day: 14 },
  { name: "Laurents ten Voorde", dob: "1962-05-15", month: 5, day: 15 },
  { name: "Antoinette Geels", dob: "1968-05-25", month: 5, day: 25 },
  { name: "Levan Hendriks", dob: "2007-06-07", month: 6, day: 7 },
  { name: "Maud Meilink", dob: "2006-06-17", month: 6, day: 17 },
  { name: "Linda Drost", dob: "1987-06-18", month: 6, day: 18 },
  { name: "Tico van der Linde", dob: "1984-06-19", month: 6, day: 19 },
  { name: "Gerald Wijnen", dob: "1970-06-19", month: 6, day: 19 },
  { name: "Ansjelo Gerritsen", dob: "1998-07-01", month: 7, day: 1 },
  { name: "Marwan hersi", dob: "1986-07-08", month: 7, day: 8 },
  { name: "Edwin Hüsing", dob: "1966-07-29", month: 7, day: 29 },
  { name: "Kevin Keizer", dob: "1995-08-03", month: 8, day: 3 },
  { name: "Iné van Dijk", dob: "2004-08-06", month: 8, day: 6 },
  { name: "Peter Karssies", dob: "1964-09-06", month: 9, day: 6 },
  { name: "Gerwin Meilink", dob: "1973-09-09", month: 9, day: 9 },
  { name: "Raymond van Dijk", dob: "1976-09-24", month: 9, day: 24 },
  { name: "Kevin van Elven", dob: "1998-10-10", month: 10, day: 10 },
  { name: "Tim Zwiers", dob: "1998-10-11", month: 10, day: 11 },
  { name: "Stefan Boekhorst", dob: "1973-10-16", month: 10, day: 16 },
  { name: "Gilbert Rada", dob: "1973-11-12", month: 11, day: 12 },
  { name: "Desiree Wissink", dob: "1969-11-12", month: 11, day: 12 },
  { name: "Marco Vooijs", dob: "1991-11-30", month: 11, day: 30 },
  { name: "Roy Kienhuis", dob: "1993-12-24", month: 12, day: 24 },
  { name: "Fenny Voortman - Lohuis", dob: "1966-12-30", month: 12, day: 30 },
  { name: "Ilona Pigge - Maatje", dob: "1981-12-31", month: 12, day: 31 }
];

const months = [
  "januari", "februari", "maart", "april",
  "mei", "juni", "juli", "augustus",
  "september", "oktober", "november", "december"
];

function calculateAge(dob, year) {
  return year - Number(dob.substring(0, 4));
}

function getMonthDays(year, month) {
  return new Date(year, month, 0).getDate();
}

function splitName(name) {
  const parts = name.trim().split(" ");
  return parts[0];
}

/* =================================
   PATH DRAWING
================================= */

function drawPath() {
  const grid = document.getElementById("pathGrid");
  const svg = document.getElementById("pathLine");
  const path = document.getElementById("pathDrawing");
  const nodes = [...grid.querySelectorAll(".day-circle")];

  if (!nodes.length) return;

  const rect = grid.getBoundingClientRect();

  svg.setAttribute("viewBox", `0 0 ${rect.width} ${rect.height}`);

  const points = nodes.map(node => {
    const r = node.getBoundingClientRect();
    return {
      x: r.left + r.width / 2 - rect.left,
      y: r.top + r.height / 2 - rect.top
    };
  });

  let d = `M ${points[0].x} ${points[0].y}`;

  for (let i = 1; i < points.length; i++) {
    const prev = points[i - 1];
    const current = points[i];
    const midY = (prev.y + current.y) / 2;

    d += ` Q ${prev.x} ${midY}, ${current.x} ${current.y}`;
  }

  path.setAttribute("d", d);
}

/* =================================
   CONFETTI
================================= */

function launchConfetti() {
  const colors = [
    "#182b50",
    "#647da8",
    "#9699c1",
    "#6b9b80",
    "#dcefe5"
  ];

  for (let i = 0; i < 100; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti";

    piece.style.left = Math.random() * 100 + "vw";
    piece.style.background =
      colors[Math.floor(Math.random() * colors.length)];

    piece.style.animationDuration =
      (3 + Math.random() * 4) + "s";

    piece.style.animationDelay =
      Math.random() * 2 + "s";

    document.body.appendChild(piece);

    setTimeout(() => piece.remove(), 8000);
  }
}

/* =================================
   TODAY CELEBRATION
================================= */

function renderCelebration(persons, year) {
  document.getElementById("intro").style.display = "none";
  document.getElementById("pathArea").style.display = "none";

  const screen = document.querySelector(".screen");

  const celebration = document.createElement("div");
  celebration.className = "celebration";

  celebration.innerHTML = `
    <div class="celebration-inner">
      <div class="celebration-symbol">🎉</div>
      <div class="celebration-label">Vandaag in de spotlight</div>
      ${persons.map(person => `
        <h1>${person.name}</h1>
        <div class="celebration-age">
          ${calculateAge(person.dob, year)} jaar!
        </div>
      `).join("<div style='height:25px'></div>")}
      <div class="celebration-message">
        Van harte gefeliciteerd met je verjaardag!
      </div>
      <div class="celebration-bottom">
        IPEX GROUP · SAMEN BOUWEN, SAMEN VIEREN
      </div>
    </div>
  `;

  screen.insertBefore(
    celebration,
    document.querySelector(".footer")
  );

  launchConfetti();
}

/* =================================
   MAIN RENDER
================================= */

function renderPage() {

  const params = new URLSearchParams(window.location.search);
  const testMode = params.get("test") === "true";

  const now = new Date();
  const year = now.getFullYear();

  const month = testMode && params.has("month")
    ? Number(params.get("month"))
    : now.getMonth() + 1;

  const day = testMode && params.has("day")
    ? Number(params.get("day"))
    : now.getDate();

  if (testMode) {
    document.getElementById("testBanner").style.display = "block";
  }

  document.getElementById("dateDisplay").innerText =
    now.toLocaleDateString("nl-NL", {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    });

  document.getElementById("monthTag").innerText =
    months[month - 1].toUpperCase();

  const todaysBirthdays = birthdays.filter(person =>
    person.month === month && person.day === day
  );

  if (todaysBirthdays.length > 0) {
    renderCelebration(todaysBirthdays, year);
    return;
  }

  const monthlyBirthdays = birthdays.filter(person =>
    person.month === month
  );

  const birthdayMap = {};

  monthlyBirthdays.forEach(person => {
    if (!birthdayMap[person.day]) {
      birthdayMap[person.day] = [];
    }
    birthdayMap[person.day].push(person);
  });

  const totalDays = getMonthDays(year, month);
  const grid = document.getElementById("pathGrid");

  grid.innerHTML = `
    <svg class="path-line" id="pathLine">
      <path id="pathDrawing"></path>
    </svg>
  `;

  for (let d = 1; d <= totalDays; d++) {

    const persons = birthdayMap[d] || [];
    const isPast = d < day;
    const isToday = d === day;
    const hasBirthday = persons.length > 0;

    const row = Math.floor((d - 1) / 7);
    const position = (d - 1) % 7;

    const column = row % 2 === 0
      ? position + 1
      : 7 - position;

    const node = document.createElement("div");

    node.className =
      "day" +
      (isPast ? " past" : "") +
      (isToday ? " today" : "") +
      (hasBirthday ? " birthday" : "");

    node.style.gridColumn = column;
    node.style.gridRow = row + 1;

    const birthdayNames = persons
      .map(person => person.name)
      .join(", ");

    const ageText = persons
      .map(person => calculateAge(person.dob, year))
      .join(" / ");

    node.innerHTML = `
      <div class="day-circle">
        ${d}
        ${hasBirthday
          ? `<div class="day-number">${persons.length}</div>`
          : ""}
      </div>

      <div class="day-info">
        <div class="day-name">
          ${hasBirthday
            ? birthdayNames
            : isToday
              ? "Vandaag"
              : ""}
        </div>

        <div class="day-age">
          ${hasBirthday
            ? "Wordt " + ageText + " jaar"
            : isToday
              ? "Jouw dag!"
              : ""}
        </div>
      </div>
    `;

    grid.appendChild(node);
  }

  requestAnimationFrame(() => {
    drawPath();
    setTimeout(drawPath, 100);
  });
}

renderPage();

window.addEventListener("resize", drawPath);

setInterval(renderPage, 60000);

</script>
</body>
</html>
