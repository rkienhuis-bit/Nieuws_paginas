
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Verjaardagen Pad</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

html,body {
  width:100%; height:100vh; overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:#090d16; color:#fff;
}

.bg-gradient {
  position:absolute; inset:0;
  background:radial-gradient(circle at 50% 20%,rgba(245,158,11,.05),#090d16 85%);
  z-index:1; pointer-events:none;
}

#confettiCanvas {
  position:absolute; inset:0;
  width:100%; height:100%; z-index:4; pointer-events:none;
}

.screen-wrapper {
  position:relative; z-index:2;
  width:100%; height:100vh;
  padding:40px 60px;
  display:flex; flex-direction:column;
  justify-content:space-between;
}

.header-group {
  display:flex; justify-content:space-between;
  align-items:flex-end;
  border-bottom:1px solid rgba(255,255,255,.08);
  padding-bottom:20px;
}

.title-box h1 {
  font-size:36px; font-weight:700;
  letter-spacing:-.5px; margin-bottom:4px;
}

.title-box p {
  font-size:12px; color:#f59e0b;
  text-transform:uppercase; letter-spacing:2px;
  font-weight:600;
}

.date-display {
  font-size:15px; color:#94a3b8;
  font-weight:500;
}

.test-banner {
  position:fixed; top:15px; left:50%;
  transform:translateX(-50%);
  background:#f59e0b; color:#000;
  font-size:11px; font-weight:700;
  text-transform:uppercase; letter-spacing:1px;
  padding:4px 12px; border-radius:4px;
  z-index:999; display:none;
}

.main-content {
  flex-grow:1;
  display:flex; align-items:center;
  justify-content:center;
  padding:20px 0; overflow:hidden;
  position:relative;
}

/* SNAKE PATH */

.snake-grid {
  position:relative;
  width:100%; max-width:1180px;
  height:100%; max-height:720px;
  padding:14px 10px;
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  grid-template-rows:repeat(5,minmax(0,1fr));
  column-gap:12px; row-gap:4px;
  overflow:hidden;
}

/* Smooth, layered route */

.snake-route {
  position:absolute; inset:0;
  width:100%; height:100%;
  overflow:visible; pointer-events:none;
  z-index:0;
}

.route-shadow {
  fill:none;
  stroke:rgba(0,0,0,.34);
  stroke-width:13;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.route-line {
  fill:none;
  stroke:url(#routeGradient);
  stroke-width:7;
  stroke-linecap:round;
  stroke-linejoin:round;
  opacity:.9;
}

.route-highlight {
  fill:none;
  stroke:rgba(255,255,255,.19);
  stroke-width:1.5;
  stroke-linecap:round;
  stroke-dasharray:2 12;
}

/* Circular nodes */

.path-node {
  position:relative; z-index:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  text-align:center;
}

.node-circle {
  position:relative;
  width:55px; height:55px;
  flex:0 0 55px;
  border-radius:50%;
  display:flex; align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#26334b,#172236);
  border:4px solid #34435b;
  box-shadow:
    0 6px 0 #101827,
    0 9px 18px rgba(0,0,0,.28),
    inset 0 2px 3px rgba(255,255,255,.08);
  color:#aebbd0;
  font-size:16px; font-weight:800;
  transition:transform .3s ease,box-shadow .3s ease;
}

/* Past days */

.path-node.past { opacity:.43; }

.path-node.past .node-circle {
  background:linear-gradient(145deg,#202b3d,#151e2d);
  border-color:#2a3548;
  color:#7e8ba0;
  box-shadow:0 4px 0 #101827;
}

/* Today */

.path-node.today .node-circle {
  background:linear-gradient(145deg,#53c8f3,#168ac4);
  border-color:#8bdfff;
  color:#071827;
  box-shadow:
    0 6px 0 #12628f,
    0 0 25px rgba(56,189,248,.28),
    inset 0 2px 3px rgba(255,255,255,.35);
  transform:scale(1.13);
}

/* Birthday milestones */

.path-node.birthday .node-circle {
  background:linear-gradient(145deg,#f8c96c,#d98b24);
  border-color:#ffe0a0;
  color:#38230b;
  box-shadow:
    0 6px 0 #87551d,
    0 0 22px rgba(245,158,11,.2),
    inset 0 2px 3px rgba(255,255,255,.4);
  transform:scale(1.12);
  animation:milestoneGlow 2.8s ease-in-out infinite alternate;
}

.path-node.birthday.today .node-circle {
  background:linear-gradient(145deg,#f9d77e,#f09a32);
  border-color:#fff0c5;
  color:#38230b;
}

/* Names */

.node-title {
  display:block;
  max-width:100%;
  padding:0 3px;
  color:#e8edf5;
  font-size:11px;
  line-height:1.2;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:0 1px 5px rgba(0,0,0,.5);
}

.node-sub {
  display:block;
  color:#8291a8;
  font-size:9px;
  line-height:1.15;
  margin-top:3px;
  white-space:nowrap;
}

.path-node.birthday .node-title {
  color:#f7c66b; font-size:12px;
}

.path-node.birthday .node-sub { color:#c6a36d; }
.path-node.today .node-title { color:#65cafa; }

.milestone-star {
  position:absolute;
  right:-7px; top:-8px;
  width:21px; height:21px;
  border-radius:50%;
  display:flex; align-items:center;
  justify-content:center;
  background:#f5b83d;
  color:#38230b;
  border:2px solid #182235;
  font-size:10px;
  box-shadow:0 2px 5px rgba(0,0,0,.3);
}

@keyframes milestoneGlow {
  from {
    box-shadow:0 6px 0 #87551d,
    0 0 13px rgba(245,158,11,.16),
    inset 0 2px 3px rgba(255,255,255,.4);
  }
  to {
    box-shadow:0 6px 0 #87551d,
    0 0 25px rgba(245,158,11,.38),
    inset 0 2px 3px rgba(255,255,255,.4);
  }
}

/* Birthday celebration */

.celebration-feature {
  width:100%; max-width:650px;
  text-align:center; padding:60px 40px;
  background:radial-gradient(circle at 50% 30%,
    rgba(245,158,11,.12),transparent 70%);
  position:relative;
  animation:bounceIn 1s cubic-bezier(.175,.885,.32,1.275) forwards;
}

.celebration-feature::before {
  content:'';
  position:absolute; top:0; left:50%;
  transform:translateX(-50%);
  width:120px; height:3px;
  background:linear-gradient(90deg,transparent,#f59e0b,transparent);
  border-radius:2px;
}

.celeb-tag {
  font-size:13px; font-weight:700;
  color:#f59e0b; text-transform:uppercase;
  letter-spacing:3px; margin-bottom:20px;
}

.celeb-name-large {
  font-size:60px; font-weight:800;
  color:#fff; letter-spacing:-1px;
  margin-bottom:14px; line-height:1.1;
}

.celeb-age-badge {
  display:inline-block;
  background:rgba(245,158,11,.15);
  border:1px solid rgba(245,158,11,.3);
  color:#f59e0b; font-size:15px;
  font-weight:700; padding:6px 16px;
  border-radius:20px; margin-bottom:20px;
}

.celeb-wish-text {
  font-size:22px; color:#f3f4f6;
  font-weight:500; line-height:1.5;
}

@keyframes bounceIn {
  0% { opacity:0; transform:scale(.9) translateY(20px); }
  60% { opacity:1; transform:scale(1.02) translateY(-5px); }
  100% { opacity:1; transform:scale(1) translateY(0); }
}

@media (max-height:800px) {
  .snake-grid { padding:8px 6px; row-gap:0; }
  .node-circle {
    width:47px; height:47px;
    flex-basis:47px; font-size:14px;
  }
  .path-node { gap:5px; }
  .node-title { font-size:10px; }
  .path-node.birthday .node-title { font-size:10px; }
  .node-sub { font-size:8px; }
}
</style>
</head>

<body>

<div class="test-banner" id="testBanner">
  Test Mode Actief (?test=true)
</div>

<div class="bg-gradient"></div>
<canvas id="confettiCanvas"></canvas>

<div class="screen-wrapper">

  <div class="header-group">
    <div class="title-box">
      <h1 id="mainTitle">Verjaardagen deze maand</h1>
      <p id="subTitle">Team Overzicht</p>
    </div>
    <div class="date-display" id="dateDisplay">--</div>
  </div>

  <div class="main-content" id="contentArea"></div>

</div>

<script>

const birthdays = [
  { name:"Laila van Oversteeg", dob:"2005-01-19", month:1, day:19 },
  { name:"Malgorzata Witczak", dob:"1994-02-09", month:2, day:9 },

  { name:"Florus van den Berge", dob:"1979-04-02", month:4, day:2 },

  { name:"Martijn Steunenberg", dob:"1975-05-14", month:5, day:14 },
  { name:"Laurents ten Voorde", dob:"1962-05-15", month:5, day:15 },

  { name:"Levan Hendriks", dob:"2007-06-07", month:6, day:7 },

  { name:"Linda Drost", dob:"1987-06-18", month:6, day:18 },
  { name:"Tico van der Linde", dob:"1984-06-19", month:6, day:19 },
  { name:"Gerald Wijnen", dob:"1970-06-19", month:6, day:19 },
  { name:"Ansjelo Gerritsen", dob:"1998-07-01", month:7, day:1 },
  { name:"Marwan hersi", dob:"1986-07-08", month:7, day:8 },
  { name:"Edwin Hüsing", dob:"1966-07-29", month:7, day:29 },
  { name:"Kevin Keizer", dob:"1995-08-03", month:8, day:3 },
  { name:"Iné van Dijk", dob:"2004-08-06", month:8, day:6 },
  { name:"Peter Karssies", dob:"1964-09-06", month:9, day:6 },
  { name:"Gerwin Meilink", dob:"1973-09-09", month:9, day:9 },
  { name:"Raymond van Dijk", dob:"1976-09-24", month:9, day:24 },
  { name:"Kevin van Elven", dob:"1998-10-10", month:10, day:10 },
  { name:"Tim Zwiers", dob:"1998-10-11", month:10, day:11 },
  { name:"Stefan Boekhorst", dob:"1973-10-16", month:10, day:16 },
  { name:"Gilbert Rada", dob:"1973-11-12", month:11, day:12 },
  { name:"Desiree Wissink", dob:"1969-11-12", month:11, day:12 },
  { name:"Marco Vooijs", dob:"1991-11-30", month:11, day:30 },
  { name:"Roy Kienhuis", dob:"1993-12-24", month:12, day:24 },
  { name:"Fenny Voortman - Lohuis", dob:"1966-12-30", month:12, day:30 },
  { name:"Ilona Pigge - Maatje", dob:"1981-12-31", month:12, day:31 }
];

const dutchMonths = [
  "januari","februari","maart","april","mei","juni",
  "juli","augustus","september","oktober","november","december"
];

function splitName(fullName) {
  const parts = fullName.trim().split(" ");
  if (parts.length === 1) return { first:parts[0], last:"" };
  const last = parts.pop();
  return { first:parts.join(" "), last };
}

function calculateAge(dobString,currentYear) {
  return currentYear - new Date(dobString).getFullYear();
}

function getDaysInMonth(year,month) {
  return new Date(year,month,0).getDate();
}

/* CONFETTI */

function triggerConfetti() {
  const canvas = document.getElementById("confettiCanvas");
  const ctx = canvas.getContext("2d");

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  let particles = [];
  const colors = [
    "#f59e0b","#38bdf8","#f43f5e","#a855f7","#10b981"
  ];

  for (let i=0;i<70;i++) {
    particles.push({
      x:canvas.width/2+(Math.random()-.5)*200,
      y:canvas.height/2,
      vx:(Math.random()-.5)*12,
      vy:Math.random()*-14-4,
      size:Math.random()*8+4,
      color:colors[Math.floor(Math.random()*colors.length)],
      rotation:Math.random()*360,
      rotSpeed:(Math.random()-.5)*10,
      gravity:.35,
      opacity:1
    });
  }

  function update() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach(p => {
      p.x+=p.vx;
      p.y+=p.vy;
      p.vy+=p.gravity;
      p.rotation+=p.rotSpeed;
      p.opacity-=.008;

      if (p.opacity>0) {
        ctx.save();
        ctx.translate(p.x,p.y);
        ctx.rotate(p.rotation*Math.PI/180);
        ctx.globalAlpha=p.opacity;
        ctx.fillStyle=p.color;
        ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.6);
        ctx.restore();
      }
    });

    if (particles.some(p=>p.opacity>0)) {
      requestAnimationFrame(update);
    }
  }

  update();
}

/* DRAW THE CURVED SNAKE ROUTE */

function drawSnakeRoute() {
  const grid = document.getElementById("snakeContainer");
  const svg = document.getElementById("snakeRoute");

  if (!grid || !svg) return;

  const bounds = grid.getBoundingClientRect();
  svg.setAttribute("viewBox",`0 0 ${bounds.width} ${bounds.height}`);

  const circles = [...grid.querySelectorAll(".node-circle")];

  const points = circles.map(circle => {
    const r = circle.getBoundingClientRect();
    return {
      x:r.left+r.width/2-bounds.left,
      y:r.top+r.height/2-bounds.top
    };
  });

  if (points.length<2) return;

  let d = `M ${points[0].x} ${points[0].y}`;

  for (let i=1;i<points.length;i++) {
    const a=points[i-1];
    const b=points[i];
    const dx=b.x-a.x;
    const dy=b.y-a.y;

    if (Math.abs(dy)<2) {
      const bend=Math.max(18,Math.abs(dx)*.34);
      const direction=dx>=0?1:-1;

      d+=` C ${a.x+bend*direction} ${a.y-15},
               ${b.x-bend*direction} ${b.y+15},
               ${b.x} ${b.y}`;
    } else {
      const midY=(a.y+b.y)/2;
      const sway=(i%2===0?1:-1)*24;

      d+=` C ${a.x+sway} ${midY-8},
               ${b.x+sway} ${midY+8},
               ${b.x} ${b.y}`;
    }
  }

  ["routeShadow","routeLine","routeHighlight"].forEach(id=>{
    const path=document.getElementById(id);
    if(path) path.setAttribute("d",d);
  });
}

/* BIRTHDAY CELEBRATION */

function renderPage() {

  const urlParams = new URLSearchParams(window.location.search);
  const isTestMode = urlParams.get("test")==="true";

  if (isTestMode) {
    document.getElementById("testBanner").style.display="block";
  }

  const now=new Date();
  const currentYear=now.getFullYear();

  const currentDay=isTestMode
    ? Number(urlParams.get("day")||12)
    : now.getDate();

  const currentMonth=isTestMode
    ? Number(urlParams.get("month")||11)
    : now.getMonth()+1;

  const options={
    weekday:"long",
    day:"numeric",
    month:"long"
  };

  document.getElementById("dateDisplay").innerText =
    now.toLocaleDateString("nl-NL",options);

  const todaysBirthdays=birthdays.filter(b=>
    b.month===currentMonth && b.day===currentDay
  );

  const contentArea=document.getElementById("contentArea");

  if (todaysBirthdays.length>0) {

    document.getElementById("mainTitle").innerText="Jarig Vandaag";
    document.getElementById("subTitle").innerText="";

    let html="";

    todaysBirthdays.forEach(person=>{
      const {first,last}=splitName(person.name);
      const age=calculateAge(person.dob,currentYear);

      html+=`
        <div class="celebration-feature">
          <div class="celeb-tag">Vandaag in de spotlight</div>
          <div class="celeb-name-large">
            ${first}
            <span style="color:#f59e0b;display:block;font-size:42px;margin-top:4px;">
              ${last}
            </span>
          </div>
          <div class="celeb-age-badge">Wordt ${age} jaar</div>
          <div class="celeb-wish-text">
            Van harte gefeliciteerd met je verjaardag!
          </div>
        </div>
      `;
    });

    contentArea.innerHTML=html;
    setTimeout(triggerConfetti,200);

  } else {

    document.getElementById("mainTitle").innerText =
      "Verjaardagen deze maand";

    document.getElementById("subTitle").innerText =
      dutchMonths[currentMonth-1].toUpperCase();

    const monthlyBirthdays=birthdays.filter(b=>
      b.month===currentMonth
    );

    const totalDays=getDaysInMonth(currentYear,currentMonth);
    const birthdayMap={};

    monthlyBirthdays.forEach(b=>{
      if(!birthdayMap[b.day]) birthdayMap[b.day]=[];
      birthdayMap[b.day].push(b);
    });

    let pathHtml=`
      <div class="snake-grid" id="snakeContainer">

        <svg class="snake-route" id="snakeRoute" aria-hidden="true">
          <defs>
            <linearGradient id="routeGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#475a78"/>
              <stop offset="48%" stop-color="#7385a1"/>
              <stop offset="100%" stop-color="#b18b55"/>
            </linearGradient>
          </defs>

          <path class="route-shadow" id="routeShadow"></path>
          <path class="route-line" id="routeLine"></path>
          <path class="route-highlight" id="routeHighlight"></path>
        </svg>
    `;

    const itemsPerRow=7;

    for(let day=1;day<=totalDays;day++) {

      const people=birthdayMap[day]||[];
      const isPast=day<currentDay;
      const isToday=day===currentDay;
      const isBirthday=people.length>0;

      const row=Math.floor((day-1)/itemsPerRow);
      const position=(day-1)%itemsPerRow;

      const column=row%2===0
        ? position+1
        : itemsPerRow-position;

      const statusClass=[
        isPast?"past":"",
        isToday?"today":"",
        isBirthday?"birthday":""
      ].filter(Boolean).join(" ");

      let label=day;
      let title=isToday?"Vandaag":"";
      let sub="";

      if(isBirthday) {
        const names=people.map(person=>
          splitName(person.name).first
        ).join(" & ");

        const ages=people.map(person=>
          calculateAge(person.dob,currentYear)
        );

        title=names;
        sub=people.length>1
          ? `${people.length} jarigen`
          : `Wordt ${ages[0]} jaar`;

        label="✦";
      }

      pathHtml+=`
        <div class="path-node ${statusClass}"
             data-day="${day}"
             style="grid-column:${column};grid-row:${row+1};">

          <div class="node-circle">
            ${label}
            ${isBirthday
              ? '<span class="milestone-star">★</span>'
              : ''}
          </div>

          ${title?`
            <div class="node-text">
              <span class="node-title">${title}</span>
              <span class="node-sub">${sub}</span>
            </div>
          `:""}

        </div>
      `;
    }

    pathHtml+="</div>";
    contentArea.innerHTML=pathHtml;

    requestAnimationFrame(()=>{
      requestAnimationFrame(drawSnakeRoute);
    });
  }
}

renderPage();

window.addEventListener("resize",drawSnakeRoute);
setInterval(renderPage,60000);

</script>
</body>
</html>
