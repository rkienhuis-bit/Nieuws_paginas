<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Verjaardagen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0b0f19;
      color: #ffffff;
    }

    /* SUBTLE AMBIENT GRADIENT */
    .bg-gradient {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 80% 20%, rgba(56, 189, 248, 0.04) 0%, rgba(11, 15, 25, 1) 70%);
      z-index: 1;
      pointer-events: none;
    }

    /* FULL-SCREEN EDITORIAL CONTAINER */
    .screen-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100vh;
      padding: 50px 70px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* EDITORIAL HEADER */
    .header-group {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 24px;
    }

    .title-box h1 {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .title-box p {
      font-size: 13px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
    }

    .date-display {
      font-size: 15px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    /* TEST MODE BANNER */
    .test-banner {
      position: fixed;
      top: 15px; left: 50%; transform: translateX(-50%);
      background: #f59e0b; color: #000;
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
      padding: 4px 12px; border-radius: 4px; z-index: 999;
      display: none;
    }

    /* MAIN CONTENT AREA */
    .main-content {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }

    /* MONTHLY GRID (EDITORIAL LIST) */
    .monthly-grid {
      width: 100%;
      max-height: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      overflow-y: auto;
      padding: 4px;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

    .person-row {
      background: rgba(255, 255, 255, 0.02);
      border-left: 2px solid rgba(56, 189, 248, 0.4);
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }

    .person-row:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    /* STACKED FIRST & LAST NAME */
    .name-stack {
      display: flex;
      flex-direction: column;
    }

    .first-name {
      font-size: 15px;
      font-weight: 400;
      color: #94a3b8;
      line-height: 1.2;
    }

    .last-name {
      font-size: 18px;
      font-weight: 700;
      color: #f1f5f9;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .date-number {
      font-size: 18px;
      font-weight: 600;
      color: #38bdf8;
      font-variant-numeric: tabular-nums;
    }

    /* TODAY CELEBRATION FEATURE VIEW */
    .celebration-feature {
      width: 100%;
      max-width: 650px;
      text-align: center;
      padding: 60px 40px;
      background: radial-gradient(circle at 50% 30%, rgba(245, 158, 11, 0.08) 0%, rgba(15, 23, 42, 0) 70%);
    }

    .celeb-tag {
      font-size: 12px;
      font-weight: 700;
      color: #f59e0b;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 20px;
    }

    .celeb-name-large {
      font-size: 56px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -1px;
      margin-bottom: 16px;
      line-height: 1.1;
    }

    .celeb-wish-text {
      font-size: 20px;
      color: #94a3b8;
      font-weight: 400;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="test-banner" id="testBanner">Test Mode Actief (?test=true)</div>
  <div class="bg-gradient"></div>

  <div class="screen-wrapper">
    <!-- HEADER -->
    <div class="header-group">
      <div class="title-box">
        <h1 id="mainTitle">Verjaardagen deze maand</h1>
        <p id="subTitle">Team Overzicht</p>
      </div>
      <div class="date-display" id="dateDisplay">--</div>
    </div>

    <!-- CONTENT -->
    <div class="main-content" id="contentArea"></div>
  </div>

  <script>
    const birthdays = [
      { name: "Laila van Oversteeg", month: 1, day: 19 },
      { name: "Malgorzata Witczak", month: 2, day: 9 },
      { name: "Wendy Slag", month: 2, day: 13 },
      { name: "Robert Markvoort", month: 2, day: 22 },
      { name: "Sander Bremer", month: 3, day: 5 },
      { name: "Arjan Dijkstra", month: 3, day: 16 },
      { name: "Anja Hoevink-Zwijnenberg", month: 3, day: 25 },
      { name: "Florus van den Berge", month: 4, day: 2 },
      { name: "Remco Grondhuis", month: 4, day: 10 },
      { name: "Christoph Ahlers", month: 4, day: 19 },
      { name: "Lieke van Horssen", month: 4, day: 23 },
      { name: "Pim van Oppen", month: 5, day: 4 },
      { name: "Jeroen Schuitemaker", month: 5, day: 9 },
      { name: "Manfred Zeides", month: 5, day: 12 },
      { name: "Martijn Steunenberg", month: 5, day: 14 },
      { name: "Laurents ten Voorde", month: 5, day: 15 },
      { name: "Antoinette Geels", month: 5, day: 25 },
      { name: "Levan Hendriks", month: 6, day: 7 },
      { name: "Maud Meilink", month: 6, day: 17 },
      { name: "Linda Drost", month: 6, day: 18 },
      { name: "Tico van der Linde", month: 6, day: 19 },
      { name: "Gerald Wijnen", month: 6, day: 19 },
      { name: "Ansjelo Gerritsen", month: 7, day: 1 },
      { name: "Marwan hersi", month: 7, day: 8 },
      { name: "Edwin Hüsing", month: 7, day: 29 },
      { name: "Kevin Keizer", month: 8, day: 3 },
      { name: "Iné van Dijk", month: 8, day: 6 },
      { name: "Peter Karssies", month: 9, day: 6 },
      { name: "Gerwin Meilink", month: 9, day: 9 },
      { name: "Raymond van Dijk", month: 9, day: 24 },
      { name: "Kevin van Elven", month: 10, day: 10 },
      { name: "Tim Zwiers", month: 10, day: 11 },
      { name: "Stefan Boekhorst", month: 10, day: 16 },
      { name: "Gilbert Rada", month: 11, day: 12 },
      { name: "Desiree Wissink", month: 11, day: 12 },
      { name: "Marco Vooijs", month: 11, day: 30 },
      { name: "Roy Kienhuis", month: 12, day: 24 },
      { name: "Fenny Voortman - Lohuis", month: 12, day: 30 },
      { name: "Ilona Pigge - Maatje", month: 12, day: 31 }
    ];

    const dutchMonths = [
      "januari", "februari", "maart", "april", "mei", "juni", 
      "juli", "augustus", "september", "oktober", "november", "december"
    ];

    const professionalWishes = [
      "Van harte gefeliciteerd met je verjaardag!",
      "Een fijne verjaardag toegewenst namens het hele team!",
      "Gefeliciteerd! Maak er een fantastische dag van!",
      "Heel fijne verjaardag gewenst!"
    ];

    function splitName(fullName) {
      const parts = fullName.trim().split(' ');
      if (parts.length === 1) return { first: '', last: parts[0] };
      const last = parts.pop();
      const first = parts.join(' ');
      return { first, last };
    }

    function renderPage() {
      const urlParams = new URLSearchParams(window.location.search);
      const isTestMode = urlParams.get('test') === 'true';

      if (isTestMode) {
        document.getElementById('testBanner').style.display = 'block';
      }

      const now = new Date();
      // If test mode is on, force a date where people have birthdays (e.g., Nov 12 has Gilbert Rada & Desiree Wissink)
      const currentDay = isTestMode ? 12 : now.getDate();
      const currentMonth = isTestMode ? 11 : now.getMonth() + 1;

      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('dateDisplay').innerText = now.toLocaleDateString('nl-NL', options);

      const todaysBirthdays = birthdays.filter(b => b.month === currentMonth && b.day === currentDay);
      const contentArea = document.getElementById('contentArea');

      if (todaysBirthdays.length > 0) {
        document.getElementById('mainTitle').innerText = "Jarig Vandaag";
        document.getElementById('subTitle').innerText = "Special Occasion";

        let html = '';
        todaysBirthdays.forEach(person => {
          const { first, last } = splitName(person.name);
          const wish = professionalWishes[person.name.length % professionalWishes.length];
          html += `
            <div class="celebration-feature">
              <div class="celeb-tag">Vandaag in de spotlight</div>
              <div class="celeb-name-large">${first}<br><span style="color:#f59e0b;">${last}</span></div>
              <div class="celeb-wish-text">${wish} We wensen je een fantastisch jaar toe!</div>
            </div>
          `;
        });
        contentArea.innerHTML = html;
      } else {
        document.getElementById('mainTitle').innerText = "Verjaardagen deze maand";
        document.getElementById('subTitle').innerText = dutchMonths[currentMonth - 1].toUpperCase();

        const monthlyBirthdays = birthdays.filter(b => b.month === currentMonth);
        monthlyBirthdays.sort((a, b) => a.day - b.day);

        if (monthlyBirthdays.length === 0) {
          contentArea.innerHTML = `<div style="color: #64748b; font-size: 16px;">Geen verjaardagen in deze maand.</div>`;
        } else {
          let gridHtml = `<div class="monthly-grid">`;
          monthlyBirthdays.forEach(person => {
            const { first, last } = splitName(person.name);
            gridHtml += `
              <div class="person-row">
                <div class="name-stack">
                  <span class="first-name">${first}</span>
                  <span class="last-name">${last}</span>
                </div>
                <div class="date-number">${person.day} ${dutchMonths[currentMonth - 1].slice(0,3)}.</div>
              </div>
            `;
          });
          gridHtml += `</div>`;
          contentArea.innerHTML = gridHtml;
        }
      }
    }

    renderPage();
    setInterval(renderPage, 60 * 1000);
  </script>
</body>
</html>
