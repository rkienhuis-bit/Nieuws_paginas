<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>NOS Binnenland</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: transparent;
      color: #ffffff;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .news-card {
      display: flex;
      flex-direction: row;
      width: 100%;
      height: 100vh;
      background: rgba(17, 17, 17, 0.85);
      overflow: hidden;
    }

    /* AFBEELDING: 30% van het scherm in plaats van 50% */
    .news-image-container {
      width: 30%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      flex-shrink: 0;
    }
    .news-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .news-content {
      width: 70%;
      padding: 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .news-category {
      color: #e30613;
      font-size: 22px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 15px;
      letter-spacing: 1.5px;
    }
    .news-title {
      font-size: 42px;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 20px;
      color: #ffffff;
    }
    .news-description {
      font-size: 26px;
      line-height: 1.45;
      color: #dddddd;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .fade {
      transition: opacity 0.8s ease-in-out;
      opacity: 1;
    }
    .fade-out {
      opacity: 0;
    }
  </style>
</head>
<body>

  <div class="news-card fade" id="newsCard">
    <div class="news-image-container" id="imgContainer">
      <img id="newsImg" class="news-image" src="" alt="Nieuws afbeelding" style="display:none;" />
    </div>
    <div class="news-content">
      <div class="news-category" id="newsCat">BINNENLAND</div>
      <h1 class="news-title" id="newsTitle">NOS Nieuws laden...</h1>
      <p class="news-description" id="newsDesc"></p>
    </div>
  </div>

  <script>
    const RSS_URL = 'https://feeds.nos.nl/nosnieuwsbuitenland'; 
const CATEGORY_LABEL = 'BUITENLAND';
    const DISPLAY_DURATION = 15000; // 15 seconden per bericht

    const API_URL = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(RSS_URL);
    let items = [];
    let currentIndex = 0;

    function extractImage(item) {
      if (item.thumbnail) return item.thumbnail;
      if (item.enclosure && item.enclosure.link) return item.enclosure.link;
      const imgMatch = item.description ? item.description.match(/<img[^>]+src="([^">]+)"/) : null;
      return imgMatch ? imgMatch[1] : null;
    }

    function cleanText(html) {
      const div = document.createElement("div");
      div.innerHTML = html || "";
      return div.textContent || div.innerText || "";
    }

    async function fetchRSS() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        if (data.status === 'ok' && data.items.length > 0) {
          items = data.items;
          showNextStory();
        }
      } catch (err) {
        document.getElementById('newsTitle').innerText = 'Fout bij het laden van het nieuws.';
      }
    }

    function showNextStory() {
      if (items.length === 0) return;
      const card = document.getElementById('newsCard');
      card.classList.add('fade-out');

      setTimeout(() => {
        const item = items[currentIndex];
        const imgUrl = extractImage(item);
        const imgEl = document.getElementById('newsImg');

        if (imgUrl) {
          imgEl.src = imgUrl;
          imgEl.style.display = 'block';
          document.getElementById('imgContainer').style.display = 'block';
        } else {
          imgEl.style.display = 'none';
          document.getElementById('imgContainer').style.display = 'none';
        }

        document.getElementById('newsCat').innerText = CATEGORY_LABEL;
        document.getElementById('newsTitle').innerText = item.title;
        document.getElementById('newsDesc').innerText = cleanText(item.description);

        card.classList.remove('fade-out');
        currentIndex = (currentIndex + 1) % items.length;
      }, 800);
    }

    fetchRSS();
    setInterval(showNextStory, DISPLAY_DURATION);
    setInterval(fetchRSS, 15 * 60 * 1000);
  </script>

</body>
</html>
